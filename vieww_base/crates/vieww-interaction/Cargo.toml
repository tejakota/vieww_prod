[package]
name = "vieww-interaction"
description = "Input the render tree does not already own: keyboard shortcut/accelerator tables, a named-action command registry, and the portable half of outbound drag-and-drop — sitting beside vieww-gestures rather than inside vieww-render, so an application can bind a shortcut or register a command with no tree, no frame and no window in sight."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
vieww-foundation.workspace = true

[lints]
workspace = true

# The Windows `DoDragDrop` bridge (`src/drag_out_windows.rs`). Feature
# names verified against the fetched `windows` 0.58 source — the same
# diligence `vieww-hal`'s d3d12 feature list documents, and for the same
# reason: an omitted one is an unresolved import on the only target that
# compiles this module, which is a target this container is not.
#
# KNOWN DUPLICATE: this 0.58 pin (shared with `vieww-hal`'s optional d3d12
# feature) does not unify with the 0.62.2 that `accesskit` requires, so a
# Windows build links two copies of `windows`/`windows-core`. It is sound
# — the two never exchange types across the boundary — but it is dead
# weight in the binary, and two FFI surfaces is the wrong number for a
# repo that pins everything else. Deduplicating means moving this crate
# to 0.62, which is NOT a version-number change: `windows-core` 0.62
# reworks `#[implement]` and the `Ref`/`IUnknown` borrowing that
# `src/drag_out_windows.rs`'s `IDropSource` impl is written against.
# Do it behind a real Windows CI run, never on inspection alone.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    # `STGMEDIUM` and `ReleaseStgMedium` are cfg'd behind these two
    # features the `windows` crate's own cfgs demand (verified against the
    # fetched 0.58 source — the transitive-feature hunt is exactly what
    # `vieww-hal`'s d3d12 feature list documents).
    "Win32_Graphics_Gdi",
    "Win32_System_Com_StructuredStorage",
    # The `#[implement(IDropSource)]` macro and the generated
    # `IDropSource_Impl` trait live behind this feature.
    "implement",
] }
windows-core = "0.58"
