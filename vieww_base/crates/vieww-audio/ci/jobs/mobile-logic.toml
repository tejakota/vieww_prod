# Focus and session logic (Linux)
# Moved from .github/workflows/cloud-mobile-audio.yml. Run by ci/lib/run.py;
# checkout, toolchain actions, caches and artifacts come from ci.toml.

name = "Focus and session logic (Linux)"

[defaults]
shell = "bash"
working-directory = "vieww_base"

[env]
CARGO_TERM_COLOR = "always"
RUST_BACKTRACE = "1"
CARGO_PROFILE_DEV_DEBUG = "0"
CARGO_INCREMENTAL = "0"

[[step]]
name = "Toolchain"
run = "rustup show active-toolchain || rustup toolchain install"

[[step]]
name = "vieww-audio focus, session, engine, supervisor"
run = "cargo test -p vieww-audio --lib -- focus session resilient engine_player"

[[step]]
name = "iOS plist opt-in (vieww-build)"
run = "cargo test -p vieww-build --lib -- package"

[[step]]
name = "AXML editor"
run = "python3 -I ci/mobile/test_axml.py"
