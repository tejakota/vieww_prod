[package]
name = "vieww-audio"
description = "The vieww audio engine: synthesis, effects, mixing, codecs, MIDI, sequencing and metering, with no third-party dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# The only dependency, deliberately, for the same reason as `vieww-animation`:
# a waveform is a function of time. Synthesis, mixing and WAV parsing need no
# tree to walk and no pixels to draw on, which is what lets all of it be
# tested by handing a `Duration` — and what lets a platform crate register a
# real audio backend against the service trait without this crate ever
# learning what an audio device looks like.
vieww-foundation.workspace = true
# `#[realtime]` (AU-18): a proc-macro crate with no dependencies of its
# own, so the dependency tree above stays as it is.
vieww-audio-macros.workspace = true

[features]
default = ["aac"]
# The AAC-LC decoder (ADTS and MP4/M4A). On by default; a distributor whose
# counsel prefers not to ship an AAC decoder builds with
# `default-features = false` and AAC input fails with
# `CodecError::Unsupported`. See PATENTS.md.
aac = []
# Web MIDI on wasm32, through the `vieww_midi` JS shim (web/vieww-midi.js).
# Opt-in: the backend's exported receive hook keeps the shim's imports in
# every wasm build, and a page that does not load the shim then fails to
# start at all ("Failed to resolve module specifier vieww_midi" — every web
# app, framework-checks 2026-11-03). An app that wants MIDI on the web turns
# this on and serves the shim; without it wasm32 reports no MIDI ports.
web-midi = []

[lints]
workspace = true

# Counts every allocation in the process, so it runs without libtest's
# threads; see the file's docs.
[[test]]
name = "realtime_no_alloc"
harness = false
