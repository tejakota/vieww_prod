# Coverage floor
# Moved from .github/workflows/shared-framework-checks.yml. Run by ci/lib/run.py;
# checkout, toolchain actions, caches and artifacts come from ci.toml.

name = "Coverage floor"

[defaults]
shell = "bash"
working-directory = "vieww_base"

[env]
CARGO_TERM_COLOR = "always"
RUST_BACKTRACE = "1"
RUST_VERSION = "1.98.1"

[[step]]
name = "Toolchain and cargo-llvm-cov"
run = '''
rustup toolchain install "$RUST_VERSION" --profile minimal --component llvm-tools-preview
cargo install cargo-llvm-cov --locked
'''

[[step]]
name = "System packages"
run = '''
sudo apt-get update -q
sudo apt-get install -y -q libx11-dev libxkbcommon-dev libwayland-dev libgtk-3-dev libxdo-dev libasound2-dev
'''

[[step]]
name = "Free disk"
run = "bash ci/tools/ci-runner-prep.sh || true"

[[step]]
name = "Coverage"
run = "ci/check/coverage.sh"
