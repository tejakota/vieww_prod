# Linux hardware
# Moved from .github/workflows/device-machines-hardware.yml. Run by ci/lib/run.py;
# checkout, toolchain actions, caches and artifacts come from ci.toml.

name = "Linux hardware"

[defaults]
shell = "bash"
working-directory = "vieww_base"

[[step]]
name = "Hardware run"
env = { STEPS = "${{ inputs.linux_steps || 'env gpu nvidia gallery baseline size stress desktop audio wright-docker' }}", VIEWW_HW_LAUNCHES = "${{ inputs.launches || '5' }}", VIEWW_HW_OUT = "${{ runner.temp }}/hardware-linux" }
run = "ci/hardware/linux.sh $STEPS"

[[step]]
name = "mark: upload hardware-linux"
if = "always()"
shell = "bash"
working-directory = "."
run = '''
echo "CI_UPLOAD_0=yes" >> "$GITHUB_ENV"
'''
