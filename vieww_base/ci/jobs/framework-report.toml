# Publish results to ci-runs/<branch>
# Moved from .github/workflows/shared-framework-checks.yml. Run by ci/lib/run.py;
# checkout, toolchain actions, caches and artifacts come from ci.toml.

name = "Publish results to ci-runs/<branch>"

[defaults]
shell = "bash"
working-directory = "."

[env]
CARGO_TERM_COLOR = "always"
RUST_BACKTRACE = "1"
RUST_VERSION = "1.98.1"

[[step]]
name = "Collect conclusions and failed logs"
env = { GH_TOKEN = "${{ github.token }}", REPO = "${{ github.repository }}", RUN = "${{ github.run_id }}", LEGS = "${{ inputs.legs }}" }
run = '''
mkdir -p out/logs
gh api "repos/$REPO/actions/runs/$RUN/jobs?per_page=100" > out/jobs.json
{
  echo "# ${GITHUB_REF_NAME} @ ${GITHUB_SHA}"
  echo
  echo "run: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${RUN}"
  echo
  echo "legs: ${LEGS:-all}"
  echo
  jq -r '.jobs[] | select(.name | startswith("Publish") | not) | "- \(.conclusion // .status): \(.name)"' out/jobs.json
} > out/SUMMARY.md
# Each failed job's log, the last 400 lines. Through curl, not
# `gh api`: the endpoint answers with a redirect to log storage,
# and curl drops the Authorization header when the redirect leaves
# api.github.com, which that storage requires. Retried, because a
# job that finished seconds before this one may not be archived
# yet. **Never empty and silent:** run 39229823591 (2026-10-19)
# published four 0-byte logs because the old fetch discarded its
# own error, so a failure here writes the HTTP status instead.
jq -r '.jobs[] | select(.conclusion == "failure") | "\(.id)\t\(.name)"' out/jobs.json |
while IFS=$'\t' read -r id name; do
  safe=$(printf '%s' "$name" | tr -c 'A-Za-z0-9._-' '_')
  code=000
  for attempt in 1 2 3 4; do
    code=$(curl -sSL -o "out/logs/$safe.full" -w '%{http_code}' \
      -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
      "https://api.github.com/repos/$REPO/actions/jobs/$id/logs" 2>"out/logs/$safe.err") || code=000
    if [ "$code" = 200 ] && [ -s "out/logs/$safe.full" ]; then break; fi
    sleep 15
  done
  if [ "$code" = 200 ] && [ -s "out/logs/$safe.full" ]; then
    tail -n 400 "out/logs/$safe.full" > "out/logs/$safe.log"
  else
    {
      echo "log fetch failed for job $id after 4 attempts: HTTP $code"
      cat "out/logs/$safe.err" "out/logs/$safe.full" 2>/dev/null | head -c 2000
    } > "out/logs/$safe.log"
  fi
  rm -f "out/logs/$safe.full" "out/logs/$safe.err"
done
cat out/SUMMARY.md
'''

[[step]]
name = "Push to ci-runs/<branch>"
env = { TOKEN = "${{ github.token }}", REPO = "${{ github.repository }}" }
run = '''
branch="ci-runs/${GITHUB_REF_NAME//\//-}"
cd out
git init -q
git checkout -q -b "$branch"
git config user.name "vieww-ci"
git config user.email "vieww-ci@users.noreply.github.com"
git add -A
git commit -q -m "CI results for ${GITHUB_SHA} (${GITHUB_REF_NAME})"
git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$branch"
'''
