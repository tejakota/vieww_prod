# Android emulator (APK, device and accessibility suites)
# Moved from .github/workflows/shared-framework-checks.yml. Run by ci/lib/run.py;
# checkout, toolchain actions, caches and artifacts come from ci.toml.

name = "Android emulator (APK, device and accessibility suites)"

[defaults]
shell = "bash"
working-directory = "vieww_base"

[env]
CARGO_TERM_COLOR = "always"
RUST_BACKTRACE = "1"
RUST_VERSION = "1.98.1"

[[step]]
name = "KVM for the emulator"
run = '''
echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
sudo udevadm control --reload-rules
sudo udevadm trigger --name-match=kvm
'''

[[step]]
name = "Toolchain, target and cargo-apk"
run = '''
rustup toolchain install "$RUST_VERSION" --profile minimal
rustup target add --toolchain "$RUST_VERSION" x86_64-linux-android
cargo install --locked cargo-apk
'''

[[step]]
name = "Emulator, APK, suites"
part = "emulator"
shell = "bash"
working-directory = "vieww_base"
env = { ANDROID_NDK_HOME = "${{ env.ANDROID_NDK_LATEST_HOME }}" }
run = '''
bash -ec ". ci/mobile/android-env.sh && android_env device-suite && ci/mobile/apk.sh --example android --target x86_64-linux-android && (ci/mobile/maestro.sh android || echo '::warning::Maestro flows failed (see the maestro-android artifact)') && ci/mobile/device-suite.sh && ci/mobile/a11y-android.sh"
'''

[[step]]
name = "mark: upload maestro-android"
part = "final"
if = "always()"
shell = "bash"
working-directory = "."
run = '''
echo "CI_UPLOAD_0=yes" >> "$GITHUB_ENV"
'''
