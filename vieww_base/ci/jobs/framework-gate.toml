# checks.sh (Linux)
# Moved from .github/workflows/shared-framework-checks.yml. Run by ci/lib/run.py;
# checkout, toolchain actions, caches and artifacts come from ci.toml.

name = "checks.sh (Linux)"

[defaults]
shell = "bash"
working-directory = "vieww_base"

[env]
CARGO_TERM_COLOR = "always"
RUST_BACKTRACE = "1"
RUST_VERSION = "1.98.1"

[[step]]
name = "Toolchain"
run = "rustup toolchain install \"$RUST_VERSION\" --profile minimal --component rustfmt,clippy,llvm-tools-preview"

[[step]]
name = "System packages"
run = '''
sudo apt-get update -q
sudo apt-get install -y -q libx11-dev libxkbcommon-dev libwayland-dev libgtk-3-dev \
  libxdo-dev libasound2-dev xvfb
'''

[[step]]
name = "Free disk"
run = "bash ci/tools/ci-runner-prep.sh || true"

[[step]]
name = "The gate"
run = "ci/check/checks.sh"

[[step]]
name = "Performance budget (advisory, FW-08)"
if = "always()"
run = '''
py="$(command -v python3 || command -v python)"
"$py" -I ci/check/perf_baseline.py framework-checks perf-linux "$RUNNER_TEMP/perf-baseline.json"
bash ci/check/perf-budget.sh --advisory --baseline "$RUNNER_TEMP/perf-baseline.json" \
  --write-measured "$RUNNER_TEMP/perf/perf-measured.json"
'''

[[step]]
name = "mark: upload perf-linux"
if = "always()"
shell = "bash"
working-directory = "."
run = '''
echo "CI_UPLOAD_0=yes" >> "$GITHUB_ENV"
'''
