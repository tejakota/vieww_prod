# The Xcode project for the accessibility suite — generated by XcodeGen from
# this file, never committed (`.gitignore` keeps the generated .xcodeproj out).
#
#   ci/mobile/a11y-ios.sh --xcuitest     # generates, builds, runs the suite
#
# # Why the project is generated and the app target has no sources
#
# `ci/mobile/ios-app.sh` builds the app: a plain cargo binary wrapped in a
# hand-written bundle, because nothing about a Rust binary needs Xcode's
# opinion about targets (that script's header says why). What XCUITest needs
# is different: a *project* with a UI-testing bundle and an application
# target to launch. `xcodegen` writes that project from this spec in one
# command, so the repository carries the 40 lines a human edits rather than
# the generated 400 a human would have to keep in sync — the same rule the
# bundle follows, one step up.
#
# The app target still has no sources to compile. Its single build phase
# copies the bundle `ios-app.sh` produced into Xcode's built products, which
# makes the app under test byte-for-byte the app that ships, rather than an
# Xcode-baked twin that could drift (a different Info.plist there would be a
# suite that passes while the real bundle fails, which is the expensive kind
# of green).
#
# # The assertions
#
# `ViewwA11yTests.swift`, in this directory: the tree-level VoiceOver
# contract (button present, labelled, traited, bridge identifiers), plus the
# FW-11 typing legs. The suite's own header says what a green run does and
# does not settle.
name: ViewwA11y
options:
  bundleIdPrefix: dev.vieww
  deploymentTarget:
    iOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    # The simulator runs unsigned bundles (ios-app.sh installs them that way
    # already); a signing identity on a machine nobody configured must not be
    # the reason the suite cannot run.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  # The application under test: ios-app.sh's bundle, copied in place.
  vieww:
    type: application
    platform: iOS
    # No compiled sources — see the header. An empty list is deliberate, not
    # an omission: everything the target produces comes from the phase below.
    sources: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vieww.demo
        PRODUCT_NAME: vieww
        # The one target the suite launches; TEST_TARGET_NAME on the test
        # target must match this name exactly.
        TARGET_NAME: vieww
    info:
      # Overwritten in spirit by the copied bundle's own Info.plist (the
      # phase below replaces the whole .app), but xcodegen requires one, and
      # the keys mirror ios-app.sh's so a stray Xcode build of the target
      # alone still produces a launchable app rather than a broken one.
      path: generated/Vieww-Info.plist
      properties:
        CFBundleDisplayName: vieww
        CFBundleIdentifier: dev.vieww.demo
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        MinimumOSVersion: "13.0"
        UIDeviceFamily: [1, 2]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    buildPhases:
      # Runs last in the target's phases, so it replaces whatever Xcode laid
      # down with the bundle the suite is actually meant to test.
      - script:
          name: Copy the cargo-built app bundle
          shellPath: /bin/sh
          # `set -e` only: the phase must fail loudly when the bundle is
          # missing, and say where it looked, because "built the twin instead
          # of the app" is a failure mode this suite exists to rule out.
          script: |
            set -e
            APP="$SRCROOT/../../../target/ios/vieww.app"
            if [ ! -d "$APP" ]; then
              echo "error: no app bundle at $APP — run ci/mobile/ios-app.sh --sim --bundle-only first" >&2
              exit 1
            fi
            rm -rf "$BUILT_PRODUCTS_DIR/vieww.app"
            cp -R "$APP" "$BUILT_PRODUCTS_DIR/vieww.app"
            echo "copied $(du -sh "$BUILT_PRODUCTS_DIR/vieww.app" | cut -f1) of app bundle"

  # The XCUITest bundle: the assertion set, pointed at the app above.
  ViewwA11yTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ViewwA11yTests.swift
    dependencies:
      - target: vieww
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vieww.a11ytests
        # Which application `XCUIApplication()` launches. Not TEST_HOST: a
        # UI test drives the app from outside, and a test host would instead
        # run the assertions inside it — in-app testing, a different thing.
        TEST_TARGET_NAME: vieww

schemes:
  ViewwA11y:
    build:
      targets:
        vieww: all
        ViewwA11yTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - ViewwA11yTests
