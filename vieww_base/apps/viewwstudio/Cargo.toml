[package]
name = "viewwstudio"
description = "vieww Studio: a desktop editor and device-framed preview for vieww screens, built with vieww."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# **The umbrella crate, and the whole reason the preview renders at all.**
#
# The buffer is compiled against `vieww`, so the widgets it builds are
# `vieww`'s types. The host resolves them through a `TypeId`-keyed factory. If
# the studio links `vieww-widget` directly and the guest reaches it through a
# separately-built `vieww`, those are two compilations of one crate and their
# `TypeId`s do not match — the factory misses every widget, and the preview
# renders nothing at all while reporting success. Depending on `vieww` here is
# what puts host and guest in one dependency graph.
vieww.workspace = true
vieww-platform-winit.workspace = true
vieww-foundation.workspace = true
vieww-widget.workspace = true
vieww-element.workspace = true
vieww-render.workspace = true
vieww-text.workspace = true
vieww-gestures.workspace = true
# The out-of-process preview's child rasterises the guest itself
# (`src/remote.rs`). Already in this graph through `vieww-platform-winit`;
# named because the child calls it directly.
vieww-paint = { workspace = true, features = ["native"] }
# Say: the English-facing screen language. The studio hands a `.say` buffer
# to `vieww_say_codegen::compile` ahead of the usual compile step; see
# `docs/SAY.md`.
vieww-say-codegen.workspace = true
# For `AssetBundle`/`DirectoryBundle`/`EmbeddedBundle`: the studio wraps the
# platform's bundle in a `WorkspaceBundle` that resolves against the open
# project's `assets/` first. See `src/assets.rs`. The image codec the asset
# browser previews with is the same crate's.
vieww-asset.workspace = true
# The asset browser reads a font's own name table (`src/assets_browser.rs`).
# Not a new dependency in the tree: `vieww-text` and `vieww-paint` already
# compile this exact version, and the studio names it directly for the same
# reason it names `vieww-paint` — a crate it calls itself is a crate it says.
ttf-parser = "0.25"
# For `Tickers`/`Ticker`: the caret blink is driven by the frame scheduler
# rather than a clock of its own. See `src/caret.rs`.
vieww-animation.workspace = true
# ST-10: the CRDT the shared buffer is wrapped in. `src/state/collab.rs` holds
# the active buffer's text in a `collab::Doc` (RGA) and appends its ops as
# JSONL to `<workspace>/.vieww/collab.log`; named here for the same reason
# every other direct call is named.
vieww-collab.workspace = true
# The DOM backend, for `viewwstudio-cli html`: the same walk `mytlabs`
# ships its static snapshot through, pointed at a compiled screen instead
# of an in-crate page. Not a new dependency in the tree — `vieww-element`
# and `vieww-widget` already compile it — and nothing the windowed studio
# links changes: only the CLI names it.
vieww-platform-web-dom.workspace = true
# The studio's own codecs, for `viewwstudio-cli animate` and `preview`: the
# workspace's GIF encoder turns a frame sequence into a looping animation
# without ffmpeg, and the PNG encoder wraps the remote preview child's raw
# RGBA into something a browser's <img> can load. Not a new dependency in
# the tree either — `vieww-asset` already compiles it for decoding.
vieww-image.workspace = true

# The only third-party dependency in the studio, and it is here because the
# alternative is `dlopen` through `libc` by hand. Pinned loosely: the surface
# used is `Library::new` and `get`, which has not changed in years.
libloading = "0.8"
tree-sitter = "0.26"
# **One grammar per language the studio claims to highlight.**
#
# The `Language` enum has named twenty-five languages since M6 and exactly one
# of them was highlighted; the other twenty-four were drawn as plain text with a
# correct label, which `language.rs` was honest about and which is still not
# what a person opening `Cargo.toml` in an editor expects to see.
#
# These four are the files a Rust project actually contains besides its `.rs`:
# a `Cargo.toml`, a `.json` config, a CI `.yml`, a `README.md`. Each is a
# self-contained C grammar with no dependencies of its own beyond `tree-sitter`
# itself, so the cost is compile time and binary size rather than a dependency
# tree.
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.5"

[dev-dependencies]
vieww-test-harness.workspace = true
# ST-18: the studio's own a11y gate. The audit walks the semantics tree of
# the *studio's* chrome — the flagship application proving the framework's
# accessibility story works on a real app rather than on fixtures.
vieww-accessibility.workspace = true
# `native` is vieww's one and only rasterizer, and it needs no adapter: this
# container, and every CI runner without a graphics adapter, has no GPU at
# all, which is what makes `examples/screenshot` produce a picture rather
# than an apology — see that file's own docs, and `vieww-paint::native`'s.
vieww-paint = { workspace = true, features = ["native"] }
# The GPU tests below skip on a machine with no adapter. `vieww-hardware` is
# what makes that skip *stated* — and, with VIEWW_REQUIRE_HARDWARE=gpu set, a
# failure instead, which is the whole point of the crate.
vieww-hardware = { workspace = true, features = ["gpu"] }
vieww-render.workspace = true
vieww-element.workspace = true

[lints]
workspace = true
