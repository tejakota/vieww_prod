# macOS — Seatbelt suite (WR-03)
# Moved from .github/workflows/cloud-machines-wright-sandbox.yml. Run by ci/lib/run.py;
# checkout, toolchain actions, caches and artifacts come from ci.toml.

name = "macOS — Seatbelt suite (WR-03)"

[defaults]
shell = "bash"

[[step]]
name = "Rust toolchain"
working-directory = "vieww_base/apps/wright"
run = "rustup show active-toolchain || rustup toolchain install"

[[step]]
name = "Seatbelt is present"
run = "test -x /usr/bin/sandbox-exec && /usr/bin/sandbox-exec -f /dev/null /usr/bin/true || true"

[[step]]
name = "The Seatbelt suite (policy + runtime)"
working-directory = "vieww_base/apps/wright"
run = "cargo test -p wright-tools --lib sandbox"

[[step]]
name = "doctor reports the capability"
working-directory = "vieww_base/apps/wright"
run = "cargo run -p wright -- doctor || true"
