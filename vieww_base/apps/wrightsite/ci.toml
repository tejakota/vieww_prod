# CI manifest: what this project is and what CI runs for it.
# ci/README.md explains every field; `ci/projects check` validates it.

name = "wrightsite"
kind = "site"
platforms = ["web"]
uses = ["vieww"]
build = "build-site.sh"

[deploy]
# The Cloudflare Pages project Release → Publish deploys to.
cloudflare_pages = "wrightsite"
