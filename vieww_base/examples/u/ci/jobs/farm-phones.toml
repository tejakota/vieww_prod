# Device suite on Device Farm phones
# Moved from .github/workflows/device-mobile-phone-farm.yml. Run by ci/lib/run.py;
# checkout, toolchain actions, caches and artifacts come from ci.toml.

name = "Device suite on Device Farm phones"

[defaults]
shell = "bash"
working-directory = "vieww_base"

[env]
CARGO_TERM_COLOR = "always"
RUST_VERSION = "1.98.1"
AWS_REGION = "us-west-2"
DEVICE_FARM_PROJECT_ARN = "${{ secrets.DEVICE_FARM_PROJECT_ARN }}"
HAS_ROLE = "${{ secrets.AWS_ROLE_ARN != '' }}"

[[step]]
name = "Check the secrets are there"
run = '''
[ -n "$DEVICE_FARM_PROJECT_ARN" ] || { echo "::error::secret DEVICE_FARM_PROJECT_ARN is not set"; exit 1; }
'''

[[step]]
name = "Show the OIDC claims AWS will check"
if = "env.HAS_ROLE == 'true'"
run = '''
curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
  "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" |
python3 -c "
import base64, json, sys
part = json.load(sys.stdin)['value'].split('.')[1]
claims = json.loads(base64.urlsafe_b64decode(part + '=' * (-len(part) % 4)))
for k in ('sub', 'aud', 'iss', 'repository', 'ref', 'repository_owner', 'job_workflow_ref', 'environment'):
    if k in claims:
        print(f'{k:>17}: {claims[k]}')
"
echo "The role's trust policy must allow exactly the sub and aud above."
'''

[[step]]
name = "Run on phones"
env = { DEVICES = "${{ inputs.devices }}", COUNT = "${{ inputs.count }}", TIERS = "${{ inputs.tiers }}", VIDEO = "${{ inputs.video }}", OUT = "${{ runner.temp }}/device-farm" }
run = '''
video=(); [ "$VIDEO" = true ] && video=(--video)
set +e
# The script's own output goes into the results too, with how it
# ended: a failure before any phone reported (credentials, a device
# pool, an exception) otherwise leaves the folder empty and
# ci-results with nothing but "phones: failure".
mkdir -p "$OUT"
python3 ci/mobile/device_farm.py --apk ../dist/vieww-devicefarm.apk --out "$OUT" \
  --devices "$DEVICES" --count "$COUNT" --tiers "$TIERS" "${video[@]}" 2>&1 | tee "$OUT/device_farm.log"
status=${PIPESTATUS[0]}
echo "device_farm.py exited $status" >> "$OUT/device_farm.log"
[ -f "$OUT/SUMMARY.md" ] && cat "$OUT/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
exit $status
'''

[[step]]
name = "Performance budgets"
if = "always()"
working-directory = "vieww_base"
run = '''
s="${{ runner.temp }}/device-farm/summary.json"
[ -f "$s" ] || { echo "no summary.json: the run produced no results to gate"; exit 0; }
ci/check/perf-budget.sh "$s" | tee -a "$GITHUB_STEP_SUMMARY"
'''

[[step]]
name = "mark: upload device-farm-results"
if = "always()"
shell = "bash"
working-directory = "."
run = '''
echo "CI_UPLOAD_0=yes" >> "$GITHUB_ENV"
'''
