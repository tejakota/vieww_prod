# Device suite on Device Farm iPhones
# Moved from .github/workflows/device-mobile-phone-farm.yml. Run by ci/lib/run.py;
# checkout, toolchain actions, caches and artifacts come from ci.toml.

name = "Device suite on Device Farm iPhones"

[defaults]
shell = "bash"
working-directory = "vieww_base"

[env]
CARGO_TERM_COLOR = "always"
RUST_VERSION = "1.98.1"
AWS_REGION = "us-west-2"
DEVICE_FARM_PROJECT_ARN = "${{ secrets.DEVICE_FARM_PROJECT_ARN }}"
HAS_ROLE = "${{ secrets.AWS_ROLE_ARN != '' }}"

[[step]]
name = "Run on iPhones"
env = { DEVICES = "${{ inputs.devices }}", COUNT = "${{ inputs.count }}", TIERS = "${{ inputs.tiers }}", VIDEO = "${{ inputs.video }}", OUT = "${{ runner.temp }}/device-farm-ios" }
run = '''
video=""; [ "$VIDEO" = true ] && video="--video"
set +e
# As on the phones job: the script's output and exit status go into
# the results. Run 39594824376's iPhones failed with nothing in
# ci-results to say why — the folder was empty, so nothing was
# uploaded and nothing published.
mkdir -p "$OUT"
python3 ci/mobile/device_farm.py --platform ios --ipa ../dist/vieww.ipa --out "$OUT" \
  --devices "$DEVICES" --count "$COUNT" --tiers "$TIERS" $video 2>&1 | tee "$OUT/device_farm.log"
status=${PIPESTATUS[0]}
echo "device_farm.py exited $status" >> "$OUT/device_farm.log"
[ -f "$OUT/SUMMARY.md" ] && cat "$OUT/SUMMARY.md" >> "$GITHUB_STEP_SUMMARY"
exit $status
'''

[[step]]
name = "Performance budgets"
if = "always()"
working-directory = "vieww_base"
run = '''
s="${{ runner.temp }}/device-farm-ios/summary.json"
[ -f "$s" ] || { echo "no summary.json: the run produced no results to gate"; exit 0; }
ci/check/perf-budget.sh "$s" | tee -a "$GITHUB_STEP_SUMMARY"
'''

[[step]]
name = "mark: upload device-farm-ios-results"
if = "always()"
shell = "bash"
working-directory = "."
run = '''
echo "CI_UPLOAD_0=yes" >> "$GITHUB_ENV"
'''
