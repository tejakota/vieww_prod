# The default check for a crate: clippy with warnings as errors, then its
# tests. Used by the library and desktop-app kinds.

name = "clippy and tests"

[defaults]
shell = "bash"
working-directory = "${{ matrix.workspace }}"

[env]
CARGO_TERM_COLOR = "always"
RUST_BACKTRACE = "1"

[[step]]
name = "Rust toolchain"
run = '''
rustup show active-toolchain || rustup toolchain install
rustup component add clippy
'''

[[step]]
name = "Linux build libraries"
if = "runner.os == 'Linux'"
run = '''
sudo apt-get update -qq
sudo apt-get install -y -qq libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libvulkan-dev pkg-config >/dev/null
'''

[[step]]
name = "clippy -p ${{ matrix.package }}"
run = '''
cargo clippy -p "${{ matrix.package }}" --all-targets -- -D warnings
'''

[[step]]
name = "test -p ${{ matrix.package }}"
run = '''
cargo test -p "${{ matrix.package }}"
'''
