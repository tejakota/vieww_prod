# Publish a site's built folder (the `site-<name>` artifact from the build
# job) to its Cloudflare Pages project, as the production deployment.

name = "deploy to Cloudflare Pages"

[defaults]
shell = "bash"

[[step]]
name = "The Cloudflare secrets are there"
run = '''
if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
  echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy ${{ matrix.site }}."
  exit 1
fi
test -f site-dist/index.html || { echo "::error::site-dist/ has no index.html: the build artifact is missing or empty"; exit 1; }
'''

[[step]]
name = "wrangler pages deploy → ${{ matrix.pages }}"
env = { CLOUDFLARE_API_TOKEN = "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
run = '''
npx --yes wrangler@3 pages deploy site-dist --project-name "${{ matrix.pages }}" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true | tee deploy.log
url="$(grep -Eo 'https://[^ ]+\.pages\.dev' deploy.log | tail -1)"
echo "### ${{ matrix.site }} deployed" >> "$GITHUB_STEP_SUMMARY"
echo "${url:-see the log}" >> "$GITHUB_STEP_SUMMARY"
'''
