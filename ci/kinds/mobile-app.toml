# Jobs every mobile app gets, from the app's ci.toml:
#
#   [build]
#   android = { package = "vavlt-android", apk = "vavlt" }
#   ios     = { package = "vavlt-ios", bundle_id = "dev.vavlt.app", binary = "vavlt-ios" }
#
# `row` becomes the job's matrix: the job files read ${{ matrix.app }},
# ${{ matrix.package }} and so on, exactly as the old "Build Mobile Apps"
# workflow's matrix rows did. A job runs only for apps whose ci.toml has
# its `requires` table. `{name}`, `{path}` and `{build.*}` come from the
# app's manifest.
description = "An app for Android and/or iOS built with the vieww mobile toolchain."

# CI-01: every app's own tests, in release (the profile the app ships), on a
# plain Linux runner. Before this no `cargo test` ran for any mobile app, so
# vavlt's idle-cost test and snapsearch's performance tests never gated
# anything. A PR that breaks an app's tests goes red here.
[[job]]
id = "check"
title = "cargo test --release"
file = "ci/kinds/mobile-app/check.toml"
requires = "test"
row = { app = "{name}", workdir = "{path}", test_args = "{test.args}" }
stage = "check"
depth = "quick"
runs_on = "ubuntu-24.04"
timeout = 60
checkout = { persist-credentials = false }
[[job.setup]]
uses = "rust-cache"
with = { workspaces = "{path}" }

[[job]]
id = "android"
title = "android build"
file = "ci/kinds/mobile-app/android.toml"
requires = "build.android"
row = { app = "{name}", package = "{build.android.package}", workdir = "{path}", apk_name = "{build.android.apk}" }
stage = "build"
also = ["check"]
depth = "thorough"
runs_on = "ubuntu-latest"
platforms = ["android"]
timeout = 90
secrets = ["ANDROID_KEYSTORE", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"]
checkout = { persist-credentials = false, fetch-depth = 1 }
[[job.setup]]
uses = "java"
with = { distribution = "temurin", java-version = "17" }
[[job.upload]]
name = "${{ matrix.app }}-android-apk"
path = "${{ runner.temp }}/${{ matrix.app }}-android/"
if-no-files-found = "warn"
retention-days = 30

[[job]]
id = "ios"
title = "ios build"
file = "ci/kinds/mobile-app/ios.toml"
requires = "build.ios"
row = { app = "{name}", package = "{build.ios.package}", workdir = "{path}", bundle_id = "{build.ios.bundle_id}", binary = "{build.ios.binary}", app_name = "{name}" }
stage = "build"
also = ["check"]
depth = "thorough"
runs_on = "macos-latest"
platforms = ["ios"]
timeout = 90
checkout = { persist-credentials = false, fetch-depth = 1 }
[[job.upload]]
name = "${{ matrix.app }}-ios-ipa"
path = "${{ runner.temp }}/${{ matrix.app }}-ios/"
if-no-files-found = "error"
retention-days = 30

# CI-01: the app's own scenario on phones — Firebase Test Lab's free plan,
# one app a day in turn (Devices ▸ Phone farm ▸ "Apps on Firebase Test Lab").
# The APK is built here rather than taken from Check, so a devices run needs
# nothing else to have run first. `{name}` in `when` is this app: the planner
# sets `farm.app.<name>` for the one app whose turn it is.
[[job]]
id = "farm-apk"
title = "farm apk"
file = "ci/kinds/mobile-app/android.toml"
requires = "build.android"
row = { app = "{name}", package = "{build.android.package}", workdir = "{path}", apk_name = "{build.android.apk}" }
stage = "devices"
phase = 1
when = "farm.app.{name}"
runs_on = "ubuntu-latest"
timeout = 90
secrets = ["ANDROID_KEYSTORE", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"]
checkout = { persist-credentials = false, fetch-depth = 1 }
[[job.setup]]
uses = "java"
with = { distribution = "temurin", java-version = "17" }
[[job.upload]]
name = "${{ matrix.app }}-farm-apk"
path = "${{ runner.temp }}/${{ matrix.app }}-android/"
if-no-files-found = "error"
retention-days = 7

[[job]]
id = "farm"
title = "Firebase Test Lab (free)"
file = "ci/kinds/mobile-app/farm.toml"
requires = "build.android"
row = { app = "{name}", apk_name = "{build.android.apk}" }
stage = "devices"
phase = 2
needs = ["farm-apk"]
when = "farm.app.{name}"
runs_on = "ubuntu-24.04"
timeout = 40
main_only = true
secrets = ["FIREBASE_PROJECT", "FIREBASE_SA_KEY"]
checkout = { persist-credentials = false, fetch-depth = 1 }
[[job.download]]
name = "${{ matrix.app }}-farm-apk"
path = "dist"
[[job.upload]]
# The results job turns `<app>-farm/compare.json` into the scorecard (SCORE-01).
name = "${{ matrix.app }}-farm"
path = "${{ runner.temp }}/${{ matrix.app }}-farm/"
if-no-files-found = "warn"
