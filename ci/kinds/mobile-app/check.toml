# CI-01: an app's own tests, built the way the app ships (release).

name = "cargo test --release"

[defaults]
shell = "bash"
working-directory = "${{ matrix.workdir }}"

[env]
CARGO_TERM_COLOR = "always"
RUST_BACKTRACE = "1"

[[step]]
name = "Rust toolchain"
run = '''
rustup show active-toolchain || rustup toolchain install
'''

[[step]]
name = "Linux build libraries"
if = "runner.os == 'Linux'"
run = '''
sudo apt-get update -qq
sudo apt-get install -y -qq libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libvulkan-dev pkg-config >/dev/null
'''

[[step]]
name = "cargo test --release ${{ matrix.test_args }}"
run = '''
cargo test --release ${{ matrix.test_args }}
'''
