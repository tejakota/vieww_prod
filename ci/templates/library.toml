# CI manifest: what this project is and what CI runs for it.
# ci/README.md explains every field; `ci/projects check` validates it.

name = "{name}"
kind = "library"
# Projects whose changes should also check this one ("What this branch changed").
uses = ["vieww"]

# With no [[job]] of its own the crate gets the library kind's check:
# clippy with -D warnings and `cargo test -p {package}`, in 1 · Check
# (quick). Add jobs when it needs more; for example:
#
# [[job]]
# id = "fuzz"
# file = "ci/jobs/fuzz.toml"      # steps, like a workflow job's (ci/README.md)
# stage = "check"
# depth = "thorough"
# runs_on = "ubuntu-24.04"
