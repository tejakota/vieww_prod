# CI manifest: what this project is and what CI runs for it.
# ci/README.md explains every field; `ci/projects check` validates it.

name = "{name}"
kind = "site"
platforms = ["web"]
uses = ["vieww"]
# Builds the site into <this folder>/dist/, run from the workspace root.
build = "build-site.sh"

# 4 · Release → Publish deploys dist/ to this Cloudflare Pages project.
# Remove the table to only build the site.
[deploy]
cloudflare_pages = "{name}"
