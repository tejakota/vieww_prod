# CI manifest: what this project is and what CI runs for it.
# ci/README.md explains every field; `ci/projects check` validates it.

name = "{name}"
kind = "desktop-app"
platforms = ["linux", "macos", "windows"]
uses = ["vieww"]

# With no [[job]] of its own the app gets the desktop-app kind's jobs:
# clippy and tests in 1 · Check, and `cargo build --release -p {package}`
# on each platform in 3 · Build (artifact {name}-<platform>). Jobs of
# your own replace the kind's for their stage; see ci/README.md.
