# CI manifest: what this project is and what CI runs for it.
# ci/README.md explains every field; `ci/projects check` validates it.

name = "three"
kind = "mobile-app"
platforms = ["android", "ios"]
uses = ["vieww"]

[build]
android = { package = "three-social-app", apk = "three" }
ios = { package = "three-social-app", bundle_id = "dev.three.app", binary = "three-social-app" }
