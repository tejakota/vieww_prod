[package]
name = "twin"
version = "0.1.0"
edition = "2021"
publish = false

# Its own workspace root, like every app here: a checkout inside another
# workspace must not make cargo go looking upward (see apps/soma/Cargo.toml).
[workspace]

[dependencies]
vieww = { path = "../../vieww_base/crates/vieww" }
vieww-ui-kit = { path = "../../vieww_base/crates/vieww-ui-kit" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vieww-platform-winit = { path = "../../vieww_base/crates/vieww-platform-winit" }

[lib]
name = "twin"
path = "src/lib.rs"

[[bin]]
name = "twin"
path = "src/main.rs"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
vieww-paint = { path = "../../vieww_base/crates/vieww-paint", features = ["native"] }
vieww-render = { path = "../../vieww_base/crates/vieww-render" }

[profile.dev.package."*"]
debug = 0

# >>> vieww app dist profile (ci/lib/app_profile.py; do not edit by hand) >>>
[profile.dist]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"

[profile.dist.package."*"]
opt-level = "s"
[profile.dist.package.vieww-paint]
opt-level = 3
[profile.dist.package.vieww-hal]
opt-level = 3
[profile.dist.package.vieww-text]
opt-level = 3
[profile.dist.package.vieww-effects]
opt-level = 3
# <<< vieww app dist profile <<<
