</div>

<div style="margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 8px">
<dc-import name="Morse" text="MK7" unit="{{2}}" color="#F6B95A" hint-size="60px,2px"></dc-import>
<div style="font-size: 12px; color: #94A0B6; text-align: center">Sealed voice. Nothing is recorded or stored in the clear.</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
