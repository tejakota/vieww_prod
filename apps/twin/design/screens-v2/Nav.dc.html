</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","world","chat","mind","teach","none"],"default":"home"},"$preview":{"width":390,"height":76}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'home';
const tab = (name) => ({ c: name === active ? '#5EEAB5' : '#94A0B6', cur: name === active ? 'page' : 'false' });
return { home: tab('home'), world: tab('world'), chat: tab('chat'), mind: tab('mind'), teach: tab('teach') };
}
}
</script>
</body>
</html>
