# CI manifest: what this project is and what CI runs for it.
# ci/README.md explains every field; `ci/projects check` validates it.

name = "snapsearch"
kind = "mobile-app"
platforms = ["android", "ios"]
uses = ["vieww"]

[build]
android = { package = "snapsearch", apk = "snapsearch" }
ios = { package = "snapsearch", bundle_id = "dev.snapsearch.app", binary = "snapsearch" }
