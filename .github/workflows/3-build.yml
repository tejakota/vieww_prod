# 3 · Build — run by hand: Actions → 3 · Build → Run workflow.
#
# Installable builds of the projects you pick, for the platforms you tick,
# as artifacts of the run. Nothing is published.
#
# What runs comes from the projects' ci.toml files (ci/README.md); this
# file only holds the form. _plan reads it, _job runs the picked jobs in
# up to three phases (a phase starts when the one before has finished),
# _results files the run on the ci-results branch.
name: "3 · Build"

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project (a folder with a ci.toml). Kept in sync by ci/projects sync."
        type: choice
        default: What this branch changed
        options:
          # projects: begin (ci/projects sync writes this list)
          - What this branch changed
          - All projects
          - Market Watch
          - mytlabs
          - snapsearch
          - three
          - U
          - upxcale
          - vavlt
          - vieww
          - vieww-audio
          - vieww-audio-plugin
          - viewwsite
          - viewwstudio
          - wright
          - wright-flow
          - wrightsite
          # projects: end
      linux:
        type: boolean
        default: true
      windows:
        type: boolean
        default: true
      macos:
        type: boolean
        default: true
      android:
        type: boolean
        default: true
      ios:
        type: boolean
        default: true
      web:
        description: "web (the sites)"
        type: boolean
        default: true
      version:
        description: "Version stamped into installers"
        type: string
        default: "1.0.0"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    uses: ./.github/workflows/_plan.yml
    with:
      workflow: build
      form: ${{ toJSON(inputs) }}

  phase-1:
    needs: [plan]
    if: ${{ needs.plan.result == 'success' && (needs.plan.outputs.p1 != '[]' || needs.plan.outputs.p1w != '[]') }}
    uses: ./.github/workflows/_job.yml
    secrets: inherit
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    with:
      jobs: ${{ needs.plan.outputs.p1 }}
      write_jobs: ${{ needs.plan.outputs.p1w }}
      approval: ${{ needs.plan.outputs.p1a == 'true' }}
      vars: ${{ toJSON(vars) }}

  phase-2:
    needs: [plan, phase-1]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.p2 != '[]' || needs.plan.outputs.p2w != '[]') }}
    uses: ./.github/workflows/_job.yml
    secrets: inherit
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    with:
      jobs: ${{ needs.plan.outputs.p2 }}
      write_jobs: ${{ needs.plan.outputs.p2w }}
      approval: ${{ needs.plan.outputs.p2a == 'true' }}
      vars: ${{ toJSON(vars) }}

  phase-3:
    needs: [plan, phase-2]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.p3 != '[]' || needs.plan.outputs.p3w != '[]') }}
    uses: ./.github/workflows/_job.yml
    secrets: inherit
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    with:
      jobs: ${{ needs.plan.outputs.p3 }}
      write_jobs: ${{ needs.plan.outputs.p3w }}
      approval: ${{ needs.plan.outputs.p3a == 'true' }}
      vars: ${{ toJSON(vars) }}

  results:
    needs: [plan, phase-1, phase-2, phase-3]
    if: ${{ always() && needs.plan.result != 'skipped' }}
    uses: ./.github/workflows/_results.yml
    permissions:
      contents: write
      actions: read
    with:
      run_id: ${{ github.run_id }}
      workflow: ${{ github.workflow }}
      conclusion: ${{ (contains(needs.*.result, 'failure') && 'failure') || (contains(needs.*.result, 'cancelled') && 'cancelled') || 'success' }}
