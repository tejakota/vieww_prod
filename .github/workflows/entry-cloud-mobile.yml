# GENERATED by .github/entry/entries.py from .github/entry/plan.py: edit those, not this.
#
# Cloud VM · Mobile: GitHub's hosted machines, building and testing for phones.
# The other forms: Cloud VM · Machines, Device · Machines, Device · Mobile. Nothing in this repository runs any other
# way: not on a push, a pull request, a schedule or another run.
#
# Tick what to run; the `└` fields under an item choose its steps and
# options. The run's summary starts with exactly what was chosen.

name: "Cloud VM · Mobile"

on:
  workflow_dispatch:
    inputs:
      mobile_apps:
        description: "Build the mobile apps"
        type: boolean
        default: false
      mobile_apps_platform:
        description: "  └ platform"
        type: choice
        options:
          - "both"
          - "android"
          - "ios"
        default: "both"
      u_apk:
        description: "U APK"
        type: boolean
        default: false
      u_models:
        description: "U model runtime"
        type: boolean
        default: false
      mobile_audio:
        description: "Mobile audio"
        type: boolean
        default: false
      mobile_audio_scope:
        description: "  └ which"
        type: choice
        options:
          - "all"
          - "logic"
          - "android"
          - "ios"
        default: "all"
      framework_android:
        description: "Framework: Android build"
        type: boolean
        default: false
      framework_android_emulator:
        description: "Framework: Android emulator"
        type: boolean
        default: false
      framework_ios_simulator:
        description: "Framework: iOS simulator"
        type: boolean
        default: false
      advanced:
        description: "Optional, for what the boxes don't offer: item:step key=value; … (see .github/workflows/README.md)"
        type: string
        default: ""
      save_results:
        description: "Save this run's results to the ci-results branch"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      framework_any: ${{ steps.plan.outputs.framework_any }}
      framework_legs: ${{ steps.plan.outputs.framework_legs }}
      mobile_apps: ${{ steps.plan.outputs.mobile_apps }}
      mobile_apps_only: ${{ steps.plan.outputs.mobile_apps_only }}
      mobile_audio: ${{ steps.plan.outputs.mobile_audio }}
      mobile_audio_only: ${{ steps.plan.outputs.mobile_audio_only }}
      save_results: ${{ steps.plan.outputs.save_results }}
      u_apk: ${{ steps.plan.outputs.u_apk }}
      u_apk_only: ${{ steps.plan.outputs.u_apk_only }}
      u_models: ${{ steps.plan.outputs.u_models }}
      u_models_only: ${{ steps.plan.outputs.u_models_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/entry
      - id: plan
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: python3 .github/entry/plan.py cloud-mobile

  mobile_apps:
    name: "mobile apps"
    needs: plan
    if: needs.plan.outputs.mobile_apps == 'true'
    uses: ./.github/workflows/cloud-mobile-apps.yml
    with:
      only: ${{ needs.plan.outputs.mobile_apps_only }}
    secrets: inherit

  u_apk:
    name: "U APK"
    needs: plan
    if: needs.plan.outputs.u_apk == 'true'
    uses: ./.github/workflows/cloud-mobile-u-apk.yml
    with:
      only: ${{ needs.plan.outputs.u_apk_only }}
    secrets: inherit

  u_models:
    name: "U models"
    needs: plan
    if: needs.plan.outputs.u_models == 'true'
    uses: ./.github/workflows/cloud-mobile-u-models.yml
    with:
      only: ${{ needs.plan.outputs.u_models_only }}
    secrets: inherit

  mobile_audio:
    name: "mobile audio"
    needs: plan
    if: needs.plan.outputs.mobile_audio == 'true'
    uses: ./.github/workflows/cloud-mobile-audio.yml
    with:
      only: ${{ needs.plan.outputs.mobile_audio_only }}
    secrets: inherit

  framework:
    name: "framework (mobile)"
    needs: plan
    if: needs.plan.outputs.framework_any == 'true'
    uses: ./.github/workflows/shared-framework-checks.yml
    with:
      legs: ${{ needs.plan.outputs.framework_legs }}
      device: false
    secrets: inherit
    permissions:
      contents: write
      actions: read

  results:
    name: save results
    needs: [plan, mobile_apps, u_apk, u_models, mobile_audio, framework]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.save_results == 'true'
    uses: ./.github/workflows/shared-results.yml
    with:
      run_id: ${{ github.run_id }}
      workflow: ${{ github.workflow }}
      conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
    permissions:
      contents: write
      actions: read
