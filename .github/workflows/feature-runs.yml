# Feature runs on the self-hosted machine.
#
# The release gate (release-gate.yml) proves a release. This proves a
# branch: it looks at what the branch changed against main and runs only the
# checks for those parts, on the owner's own Linux machine, where builds are
# warm (each area keeps its own target directory between runs), the kernel
# is new enough for Wright's sandbox tests, and nothing is billed by the
# minute.
#
#   changed                     runs
#   crates/**                   framework checks, then Wright, Studio and the
#                               prototype too (they all build on it)
#   apps/wright/**              Wright: clippy -D warnings, tests, UI snapshots
#   apps/wright/prototypes/**   the Wright Flow walkthroughs (GIFs), and with
#                               depth: full, its interactive web build
#   apps/viewwstudio/**         Studio's headless release check
#   ci/**, .github/**           the quick framework checks
#
# When it runs — the owner rule (2026-10-24) is that every workflow runs
# manually, so by default this does too:
#
#   Run workflow                pick the branch, `areas` (auto = from the
#                               diff) and `depth` (quick | full)
#   push to a branch            only when the repository variable
#                               FEATURE_RUNS_ON_PUSH is "true"; otherwise
#                               the plan job is skipped and no machine is used
#
# Never on pull requests: this repository is public, and a pull request
# from a fork must not run code on the owner's machine. A push can only
# come from someone with write access, so a push-triggered run executes
# only branches of this repository.
#
# Which machine: the repository variable FEATURE_RUNNER, as a JSON list of
# labels (default ["self-hosted","Linux","X64","vieww-linux"], the machine
# hardware.yml uses). One runner takes one job at a time, so the areas run
# in turn; a branch pushed again cancels its run in progress.

name: feature-runs

on:
  workflow_dispatch:
    inputs:
      areas:
        description: "auto = from the branch's diff against main; or a comma list: framework, wright, studio, prototype"
        type: string
        default: auto
      depth:
        description: "quick = the checks a feature needs; full = whole test suites, plus the prototype's web build"
        type: choice
        options: [quick, full]
        default: quick
  push:
    branches-ignore: [main]
    paths:
      - "vieww_base/crates/**"
      - "vieww_base/apps/wright/**"
      - "vieww_base/apps/viewwstudio/**"
      - "vieww_base/ci/**"
      - ".github/workflows/feature-runs.yml"

permissions:
  contents: read

concurrency:
  group: feature-runs-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Where each area keeps its build between runs on the self-hosted machine.
  # `actions/checkout` cleans the work tree every run (stale files from
  # another branch must not be compiled), so target/ is a symlink into here.
  FEATURE_CACHE: ${{ vars.FEATURE_CACHE || '~/.cache/vieww-feature-runs' }}

jobs:
  plan:
    name: plan
    if: github.event_name == 'workflow_dispatch' || vars.FEATURE_RUNS_ON_PUSH == 'true'
    runs-on: ubuntu-latest
    outputs:
      framework: ${{ steps.plan.outputs.framework }}
      wright: ${{ steps.plan.outputs.wright }}
      studio: ${{ steps.plan.outputs.studio }}
      prototype: ${{ steps.plan.outputs.prototype }}
      depth: ${{ steps.plan.outputs.depth }}
      runner: ${{ steps.plan.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        shell: bash
        env:
          AREAS: ${{ inputs.areas || 'auto' }}
          DEPTH: ${{ inputs.depth || 'quick' }}
          RUNNER: ${{ vars.FEATURE_RUNNER || '["self-hosted","Linux","X64","vieww-linux"]' }}
        run: |
          set -euo pipefail
          framework=false wright=false studio=false prototype=false
          if [ "$AREAS" = auto ]; then
            base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
            if [ -z "$base" ] || [ "$(git rev-parse HEAD)" = "$base" ]; then
              # On main itself, or no shared history: check everything.
              changed="vieww_base/crates/ vieww_base/apps/wright/ vieww_base/apps/viewwstudio/"
            else
              changed="$(git diff --name-only "$base" HEAD)"
            fi
            grep -q '^vieww_base/crates/' <<<"$changed" && framework=true wright=true studio=true prototype=true
            grep -q '^vieww_base/apps/wright/prototypes/' <<<"$changed" && prototype=true
            grep -v '^vieww_base/apps/wright/prototypes/' <<<"$changed" | grep -q '^vieww_base/apps/wright/' && wright=true
            grep -q '^vieww_base/apps/viewwstudio/' <<<"$changed" && studio=true prototype=true
            grep -qE '^(vieww_base/ci/|\.github/)' <<<"$changed" && framework=true
          else
            for a in ${AREAS//,/ }; do
              case "$a" in
                framework|wright|studio|prototype) declare "$a=true" ;;
                all) framework=true wright=true studio=true prototype=true ;;
                *) echo "::error::unknown area '$a' (framework, wright, studio, prototype, all)"; exit 1 ;;
              esac
            done
          fi
          {
            echo "framework=$framework"; echo "wright=$wright"; echo "studio=$studio"; echo "prototype=$prototype"
            echo "depth=$DEPTH"; echo "runner=$RUNNER"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Feature run · \`${GITHUB_REF_NAME}\` · $DEPTH"
            echo
            echo "| area | runs |"; echo "|---|---|"
            for a in framework wright studio prototype; do echo "| $a | ${!a} |"; done
            echo
            echo "Machine: \`$RUNNER\`"
          } >> "$GITHUB_STEP_SUMMARY"

  framework:
    name: framework (${{ needs.plan.outputs.depth }})
    needs: plan
    if: needs.plan.outputs.framework == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: vieww_base
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Warm build directory
        run: bash ../.github/feature-runs/warm-target.sh framework target
      - name: Checks
        run: |
          if [ "${{ needs.plan.outputs.depth }}" = full ]; then ci/vieww checks; else ci/vieww checks --quick; fi

  wright:
    name: wright (${{ needs.plan.outputs.depth }})
    needs: [plan, framework]
    # After framework when both run (a broken framework explains a broken
    # Wright), but not blocked by it: the point is to see both.
    if: always() && needs.plan.outputs.wright == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: vieww_base/apps/wright
    env:
      WRIGHT_HOME: ${{ github.workspace }}/.wright-home
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Warm build directory
        run: bash ../../../.github/feature-runs/warm-target.sh wright target
      - name: Clippy (zero warnings, UI included)
        run: cargo clippy --workspace --all-targets --features wright/ui -- -D warnings
      - name: Tests
        run: |
          if [ "${{ needs.plan.outputs.depth }}" = full ]; then
            cargo test --release --workspace
          else
            # The window's suite (it also renders every screen) and the
            # libraries a UI or feature change most often touches.
            cargo test --release -p wright --features ui
            cargo test --release -p wright-core -p wright-tools
          fi
      - name: UI snapshots
        if: always()
        run: |
          cargo build --release -p wright --features ui
          rm -rf "$WRIGHT_HOME" && mkdir -p "$WRIGHT_HOME"
          ./target/release/wright ui --snapshot "${{ github.workspace }}/wright-snapshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wright-snapshots
          path: wright-snapshots/
          if-no-files-found: ignore
          retention-days: 14

  studio:
    name: studio (${{ needs.plan.outputs.depth }})
    needs: [plan, wright]
    if: always() && needs.plan.outputs.studio == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: vieww_base
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Warm build directory
        run: bash ../.github/feature-runs/warm-target.sh studio target
      - name: Studio release check (headless)
        run: |
          if [ "${{ needs.plan.outputs.depth }}" = full ]; then ci/vieww studio; else ci/vieww studio --quick; fi

  prototype:
    name: prototype (${{ needs.plan.outputs.depth }})
    needs: [plan, studio]
    if: always() && needs.plan.outputs.prototype == 'true'
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: vieww_base
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The CLI finds the vieww it links next to its own source
      # (vieww_base/target/release), so this one shares the studio's build.
      - name: Warm build directory
        run: bash ../.github/feature-runs/warm-target.sh studio target
      - name: Build viewwstudio-cli
        run: cargo build --release -p viewwstudio --bin viewwstudio-cli
      - name: Walkthroughs
        run: bash apps/wright/prototypes/wright-flow/walkthrough.sh "${{ github.workspace }}/wright-flow-walkthrough"
      - name: Interactive web build
        if: needs.plan.outputs.depth == 'full'
        working-directory: vieww_base/apps/wright/prototypes/wright-flow
        run: |
          # The export needs the wasm target and the wasm-bindgen CLI at the
          # version the lockfile resolves. Missing is a SKIP with the install
          # line, never a pass.
          want="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')"
          have="$(wasm-bindgen --version 2>/dev/null | awk '{print $2}')"
          if ! rustup target list --installed | grep -q wasm32-unknown-unknown || [ "$have" != "$want" ]; then
            echo "SKIPPED: needs \`rustup target add wasm32-unknown-unknown\` and \`cargo install wasm-bindgen-cli --version $want --locked\` (have: ${have:-none})" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ../../../../target/release/viewwstudio-cli web .
          mkdir -p "${{ github.workspace }}/wright-flow-web"
          cp target/export/web/* "${{ github.workspace }}/wright-flow-web/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wright-flow
          path: |
            wright-flow-walkthrough/
            wright-flow-web/
          if-no-files-found: ignore
          retention-days: 14

  summary:
    name: summary
    needs: [plan, framework, wright, studio, prototype]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          R_FRAMEWORK: ${{ needs.framework.result }}
          R_WRIGHT: ${{ needs.wright.result }}
          R_STUDIO: ${{ needs.studio.result }}
          R_PROTOTYPE: ${{ needs.prototype.result }}
        run: |
          failed=0
          {
            echo "### Results"
            echo; echo "| area | result |"; echo "|---|---|"
            for a in FRAMEWORK WRIGHT STUDIO PROTOTYPE; do
              v="R_$a"; r="${!v}"
              case "$r" in success) m="passed" ;; skipped) m="not run (unchanged)" ;; cancelled) m="cancelled" ;; *) m="**failed**"; failed=1 ;; esac
              echo "| ${a,,} | $m |"
            done
            echo; echo "Artifacts: \`wright-snapshots\` (every window screen), \`wright-flow\` (walkthrough GIFs, web build on full)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit $failed
