# 2 · Devices — run by hand: Actions → 2 · Devices → Run workflow.
#
# Real hardware: your machines (self-hosted runners), a phone on USB, and
# the cloud phone farm. Hardware and the farm run from main only.
#
# What runs comes from the projects' ci.toml files (ci/README.md); this
# file only holds the form. _plan reads it, _job runs the picked jobs in
# up to three phases (a phase starts when the one before has finished),
# _results files the run on the ci-results branch.
name: "2 · Devices"

on:
  workflow_dispatch:
    inputs:
      linux:
        description: "My machines · Linux (vieww-linux)"
        type: boolean
        default: true
      windows:
        description: "My machines · Windows (vieww-windows)"
        type: boolean
        default: true
      mac:
        description: "My machines · Mac (vieww-macos)"
        type: boolean
        default: false
      suite:
        description: "My machines · what to run"
        type: choice
        default: everything
        options: ["everything", "quick look (env, gpu)", "gpu", "gallery", "baseline", "size", "stress", "desktop", "audio", "wright docker suite (Linux)"]
      usb_phone:
        description: "Android phone on USB (runner label android)"
        type: boolean
        default: false
      farm:
        description: "Phone farm (AWS Device Farm)"
        type: choice
        default: "off"
        options: ["off", "Android", "iPhone", "both"]
      farm_low:
        description: "Phone farm · low-end phone"
        type: boolean
        default: true
      farm_mid:
        description: "Phone farm · mid-range phone"
        type: boolean
        default: true
      farm_high:
        description: "Phone farm · high-end phone"
        type: boolean
        default: true
      video:
        description: "Phone farm · record video"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: devices-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    uses: ./.github/workflows/_plan.yml
    with:
      workflow: devices
      form: ${{ toJSON(inputs) }}

  phase-1:
    needs: [plan]
    if: ${{ needs.plan.result == 'success' && (needs.plan.outputs.p1 != '[]' || needs.plan.outputs.p1w != '[]') }}
    uses: ./.github/workflows/_job.yml
    secrets: inherit
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    with:
      jobs: ${{ needs.plan.outputs.p1 }}
      write_jobs: ${{ needs.plan.outputs.p1w }}
      approval: ${{ needs.plan.outputs.p1a == 'true' }}
      vars: ${{ toJSON(vars) }}

  phase-2:
    needs: [plan, phase-1]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.p2 != '[]' || needs.plan.outputs.p2w != '[]') }}
    uses: ./.github/workflows/_job.yml
    secrets: inherit
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    with:
      jobs: ${{ needs.plan.outputs.p2 }}
      write_jobs: ${{ needs.plan.outputs.p2w }}
      approval: ${{ needs.plan.outputs.p2a == 'true' }}
      vars: ${{ toJSON(vars) }}

  phase-3:
    needs: [plan, phase-2]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.p3 != '[]' || needs.plan.outputs.p3w != '[]') }}
    uses: ./.github/workflows/_job.yml
    secrets: inherit
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    with:
      jobs: ${{ needs.plan.outputs.p3 }}
      write_jobs: ${{ needs.plan.outputs.p3w }}
      approval: ${{ needs.plan.outputs.p3a == 'true' }}
      vars: ${{ toJSON(vars) }}

  results:
    needs: [plan, phase-1, phase-2, phase-3]
    if: ${{ always() && needs.plan.result != 'skipped' }}
    uses: ./.github/workflows/_results.yml
    permissions:
      contents: write
      actions: read
    with:
      run_id: ${{ github.run_id }}
      workflow: ${{ github.workflow }}
      conclusion: ${{ (contains(needs.*.result, 'failure') && 'failure') || (contains(needs.*.result, 'cancelled') && 'cancelled') || 'success' }}
