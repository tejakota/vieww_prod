# GENERATED by .github/entry/entries.py from .github/entry/plan.py: edit those, not this.
#
# Cloud VM · Machines: GitHub's hosted Linux, macOS and Windows machines.
# The other forms: Cloud VM · Mobile, Device · Machines, Device · Mobile. Nothing in this repository runs any other
# way: not on a push, a pull request, a schedule or another run.
#
# Tick what to run; the `└` fields under an item choose its steps and
# options. The run's summary starts with exactly what was chosen.

name: "Cloud VM · Machines"

on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Quick checks: fmt, clippy, workflow lint, Wright sandbox smoke"
        type: boolean
        default: false
      framework:
        description: "Framework checks"
        type: boolean
        default: false
      framework_scope:
        description: "  └ which framework checks"
        type: choice
        options:
          - "all"
          - "core (gate, coverage, cross)"
          - "gpu (lavapipe)"
          - "platforms (macOS, Windows, web)"
          - "extras (audio fuzz, a11y, plugins)"
        default: "all"
      studio:
        description: "Studio suite (Linux, macOS, Windows)"
        type: boolean
        default: false
      wright_sandbox:
        description: "Wright sandbox suites"
        type: boolean
        default: false
      wright_sandbox_profile:
        description: "  └ build profile"
        type: choice
        options:
          - "debug"
          - "release"
        default: "debug"
      wright_models:
        description: "Wright built-in models"
        type: boolean
        default: false
      wright_installers:
        description: "Wright desktop installers"
        type: boolean
        default: false
      wright_installers_version:
        description: "  └ version to stamp (no leading v)"
        type: string
        default: "1.0.0"
      wright_installers_release:
        description: "  └ build only, or publish"
        type: choice
        options:
          - "build only"
          - "publish as pre-release"
          - "publish as release"
        default: "build only"
      audio:
        description: "Audio"
        type: boolean
        default: false
      audio_scope:
        description: "  └ which audio"
        type: choice
        options:
          - "all"
          - "ci (tests, fuzz)"
          - "backends (servers, loopback, targets)"
          - "plugins (CLAP, VST3, LV2)"
        default: "all"
      release_gate:
        description: "Release gate, hosted legs (Windows, macOS, Linux export)"
        type: boolean
        default: false
      release_gate_scope:
        description: "  └ scope"
        type: choice
        options:
          - "gate"
          - "checks"
          - "screenshots"
        default: "gate"
      release_gate_rerun:
        description: "  └ rerun"
        type: choice
        options:
          - "failed"
          - "all"
        default: "failed"
      release_gate_package:
        description: "  └ build installers"
        type: boolean
        default: true
      supply_chain:
        description: "Supply chain: advisories, SBOM, reproducible build"
        type: boolean
        default: false
      goldens:
        description: "Golden screenshots"
        type: boolean
        default: false
      goldens_update:
        description: "  └ capture a new baseline instead of comparing"
        type: boolean
        default: false
      publish_crates:
        description: "Crates: check, verify (publishes only on a v* tag)"
        type: boolean
        default: false
      advanced:
        description: "Optional, for what the boxes don't offer: item:step key=value; … (see .github/workflows/README.md)"
        type: string
        default: ""
      save_results:
        description: "Save this run's results to the ci-results branch"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      audio: ${{ steps.plan.outputs.audio }}
      audio_only: ${{ steps.plan.outputs.audio_only }}
      framework_any: ${{ steps.plan.outputs.framework_any }}
      framework_legs: ${{ steps.plan.outputs.framework_legs }}
      goldens: ${{ steps.plan.outputs.goldens }}
      goldens_only: ${{ steps.plan.outputs.goldens_only }}
      goldens_update: ${{ steps.plan.outputs.goldens_update }}
      publish_crates: ${{ steps.plan.outputs.publish_crates }}
      publish_crates_only: ${{ steps.plan.outputs.publish_crates_only }}
      quick: ${{ steps.plan.outputs.quick }}
      quick_only: ${{ steps.plan.outputs.quick_only }}
      release_gate: ${{ steps.plan.outputs.release_gate }}
      release_gate_legs: ${{ steps.plan.outputs.release_gate_legs }}
      release_gate_package: ${{ steps.plan.outputs.release_gate_package }}
      release_gate_rerun: ${{ steps.plan.outputs.release_gate_rerun }}
      release_gate_scope: ${{ steps.plan.outputs.release_gate_scope }}
      save_results: ${{ steps.plan.outputs.save_results }}
      studio: ${{ steps.plan.outputs.studio }}
      studio_only: ${{ steps.plan.outputs.studio_only }}
      supply_chain: ${{ steps.plan.outputs.supply_chain }}
      supply_chain_only: ${{ steps.plan.outputs.supply_chain_only }}
      wright_installers: ${{ steps.plan.outputs.wright_installers }}
      wright_installers_only: ${{ steps.plan.outputs.wright_installers_only }}
      wright_installers_prerelease: ${{ steps.plan.outputs.wright_installers_prerelease }}
      wright_installers_publish: ${{ steps.plan.outputs.wright_installers_publish }}
      wright_installers_version: ${{ steps.plan.outputs.wright_installers_version }}
      wright_models: ${{ steps.plan.outputs.wright_models }}
      wright_models_only: ${{ steps.plan.outputs.wright_models_only }}
      wright_sandbox: ${{ steps.plan.outputs.wright_sandbox }}
      wright_sandbox_only: ${{ steps.plan.outputs.wright_sandbox_only }}
      wright_sandbox_profile: ${{ steps.plan.outputs.wright_sandbox_profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/entry
      - id: plan
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: python3 .github/entry/plan.py cloud-machines

  quick:
    name: "quick checks"
    needs: plan
    if: needs.plan.outputs.quick == 'true'
    uses: ./.github/workflows/cloud-machines-quick.yml
    with:
      only: ${{ needs.plan.outputs.quick_only }}
    secrets: inherit

  framework:
    name: "framework"
    needs: plan
    if: needs.plan.outputs.framework_any == 'true'
    uses: ./.github/workflows/shared-framework-checks.yml
    with:
      legs: ${{ needs.plan.outputs.framework_legs }}
      device: false
    secrets: inherit
    permissions:
      contents: write
      actions: read

  studio:
    name: "studio"
    needs: plan
    if: needs.plan.outputs.studio == 'true'
    uses: ./.github/workflows/cloud-machines-studio.yml
    with:
      only: ${{ needs.plan.outputs.studio_only }}
    secrets: inherit

  wright_sandbox:
    name: "wright sandbox"
    needs: plan
    if: needs.plan.outputs.wright_sandbox == 'true'
    uses: ./.github/workflows/cloud-machines-wright-sandbox.yml
    with:
      only: ${{ needs.plan.outputs.wright_sandbox_only }}
      profile: ${{ needs.plan.outputs.wright_sandbox_profile }}
    secrets: inherit

  wright_models:
    name: "wright models"
    needs: plan
    if: needs.plan.outputs.wright_models == 'true'
    uses: ./.github/workflows/cloud-machines-wright-models.yml
    with:
      only: ${{ needs.plan.outputs.wright_models_only }}
    secrets: inherit

  wright_installers:
    name: "wright installers"
    needs: plan
    if: needs.plan.outputs.wright_installers == 'true'
    uses: ./.github/workflows/cloud-machines-wright-installers.yml
    with:
      only: ${{ needs.plan.outputs.wright_installers_only }}
      version: ${{ needs.plan.outputs.wright_installers_version }}
      publish: ${{ needs.plan.outputs.wright_installers_publish == 'true' }}
      prerelease: ${{ needs.plan.outputs.wright_installers_prerelease == 'true' }}
    secrets: inherit
    permissions:
      contents: write

  audio_ci:
    name: "audio CI"
    needs: plan
    if: needs.plan.outputs.audio == 'true'
    uses: ./.github/workflows/cloud-machines-audio-ci.yml
    with:
      only: ${{ needs.plan.outputs.audio_only }}
    secrets: inherit

  audio_backends:
    name: "audio backends"
    needs: plan
    if: needs.plan.outputs.audio == 'true'
    uses: ./.github/workflows/cloud-machines-audio-backends.yml
    with:
      only: ${{ needs.plan.outputs.audio_only }}
    secrets: inherit

  audio_plugins:
    name: "audio plugins"
    needs: plan
    if: needs.plan.outputs.audio == 'true'
    uses: ./.github/workflows/cloud-machines-audio-plugins.yml
    with:
      only: ${{ needs.plan.outputs.audio_only }}
    secrets: inherit

  release_gate:
    name: "release gate (hosted)"
    needs: plan
    if: needs.plan.outputs.release_gate == 'true'
    uses: ./.github/workflows/shared-release-gate.yml
    with:
      legs: ${{ needs.plan.outputs.release_gate_legs }}
      scope: ${{ needs.plan.outputs.release_gate_scope }}
      rerun: ${{ needs.plan.outputs.release_gate_rerun }}
      package: ${{ needs.plan.outputs.release_gate_package == 'true' }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      attestations: write

  supply_chain:
    name: "supply chain"
    needs: plan
    if: needs.plan.outputs.supply_chain == 'true'
    uses: ./.github/workflows/cloud-machines-supply-chain.yml
    with:
      only: ${{ needs.plan.outputs.supply_chain_only }}
    secrets: inherit

  goldens:
    name: "goldens"
    needs: plan
    if: needs.plan.outputs.goldens == 'true'
    uses: ./.github/workflows/cloud-machines-goldens.yml
    with:
      only: ${{ needs.plan.outputs.goldens_only }}
      update: ${{ needs.plan.outputs.goldens_update == 'true' }}
    secrets: inherit

  publish_crates:
    name: "crates"
    needs: plan
    if: needs.plan.outputs.publish_crates == 'true'
    uses: ./.github/workflows/cloud-machines-publish.yml
    with:
      only: ${{ needs.plan.outputs.publish_crates_only }}
    secrets: inherit

  results:
    name: save results
    needs: [plan, quick, framework, studio, wright_sandbox, wright_models, wright_installers, audio_ci, audio_backends, audio_plugins, release_gate, supply_chain, goldens, publish_crates]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.save_results == 'true'
    uses: ./.github/workflows/shared-results.yml
    with:
      run_id: ${{ github.run_id }}
      workflow: ${{ github.workflow }}
      conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
    permissions:
      contents: write
      actions: read
