# GENERATED by ci/lib/make_engine.py — edit that, then run ci/projects sync.
#
# The engine: runs the jobs a numbered workflow's plan picked for one phase.
# Every entry is a job from some project's ci.toml (or its kind's): the
# engine checks out, sets up what the entry asks for, runs its job file
# through ci/lib/run.py and uploads its artifacts. It knows kinds of setup,
# never projects. `write` holds the entries that push, release or deploy;
# in a publishing phase it waits for the `release` environment's approval.
name: _job

on:
  workflow_call:
    inputs:
      jobs:
        type: string
        default: '[]'
      write_jobs:
        type: string
        default: '[]'
      approval:
        type: boolean
        default: false
      vars:
        type: string
        default: '{}'

permissions: {}

jobs:
  run:
    if: inputs.jobs != '[]'
    permissions:
      contents: read
      actions: read
      id-token: write
    name: ${{ matrix.title }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.continue_on_error }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.jobs) }}
    env:
      CI_INPUTS: ${{ matrix.inputs }}
      CI_MATRIX: ${{ matrix.matrix }}
      CI_JOB: ${{ matrix.job }}
      CI_PROJECT: ${{ matrix.project }}
      CI_VARS: ${{ inputs.vars }}
      CI_GITHUB_TOKEN: ${{ github.token }}
      CI_SECRET_NAMES: ${{ matrix.secret_list }}
      CI_HAS_AWS_ROLE: ${{ secrets.AWS_ROLE_ARN != '' }}
      ANDROID_KEYSTORE: ${{ contains(matrix.secret_names, ',ANDROID_KEYSTORE,') && secrets.ANDROID_KEYSTORE || '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ contains(matrix.secret_names, ',ANDROID_KEYSTORE_PASSWORD,') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      ANDROID_KEY_ALIAS: ${{ contains(matrix.secret_names, ',ANDROID_KEY_ALIAS,') && secrets.ANDROID_KEY_ALIAS || '' }}
      ANDROID_KEY_PASSWORD: ${{ contains(matrix.secret_names, ',ANDROID_KEY_PASSWORD,') && secrets.ANDROID_KEY_PASSWORD || '' }}
      APPLE_DEVELOPER_ID_P12: ${{ contains(matrix.secret_names, ',APPLE_DEVELOPER_ID_P12,') && secrets.APPLE_DEVELOPER_ID_P12 || '' }}
      APPLE_NOTARY_ISSUER: ${{ contains(matrix.secret_names, ',APPLE_NOTARY_ISSUER,') && secrets.APPLE_NOTARY_ISSUER || '' }}
      APPLE_NOTARY_KEY: ${{ contains(matrix.secret_names, ',APPLE_NOTARY_KEY,') && secrets.APPLE_NOTARY_KEY || '' }}
      APPLE_NOTARY_KEY_ID: ${{ contains(matrix.secret_names, ',APPLE_NOTARY_KEY_ID,') && secrets.APPLE_NOTARY_KEY_ID || '' }}
      APPLE_P12_PASSWORD: ${{ contains(matrix.secret_names, ',APPLE_P12_PASSWORD,') && secrets.APPLE_P12_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ contains(matrix.secret_names, ',APPLE_SIGNING_IDENTITY,') && secrets.APPLE_SIGNING_IDENTITY || '' }}
      AWS_ACCESS_KEY_ID: ${{ contains(matrix.secret_names, ',AWS_ACCESS_KEY_ID,') && secrets.AWS_ACCESS_KEY_ID || '' }}
      AWS_ROLE_ARN: ${{ contains(matrix.secret_names, ',AWS_ROLE_ARN,') && secrets.AWS_ROLE_ARN || '' }}
      AWS_SECRET_ACCESS_KEY: ${{ contains(matrix.secret_names, ',AWS_SECRET_ACCESS_KEY,') && secrets.AWS_SECRET_ACCESS_KEY || '' }}
      CARGO_REGISTRY_TOKEN: ${{ contains(matrix.secret_names, ',CARGO_REGISTRY_TOKEN,') && secrets.CARGO_REGISTRY_TOKEN || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ contains(matrix.secret_names, ',CLOUDFLARE_ACCOUNT_ID,') && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
      CLOUDFLARE_API_TOKEN: ${{ contains(matrix.secret_names, ',CLOUDFLARE_API_TOKEN,') && secrets.CLOUDFLARE_API_TOKEN || '' }}
      DEVICE_FARM_PROJECT_ARN: ${{ contains(matrix.secret_names, ',DEVICE_FARM_PROJECT_ARN,') && secrets.DEVICE_FARM_PROJECT_ARN || '' }}
      IOS_CERT_P12: ${{ contains(matrix.secret_names, ',IOS_CERT_P12,') && secrets.IOS_CERT_P12 || '' }}
      IOS_CERT_PASSWORD: ${{ contains(matrix.secret_names, ',IOS_CERT_PASSWORD,') && secrets.IOS_CERT_PASSWORD || '' }}
      IOS_IDENTITY: ${{ contains(matrix.secret_names, ',IOS_IDENTITY,') && secrets.IOS_IDENTITY || '' }}
      IOS_PROFILE: ${{ contains(matrix.secret_names, ',IOS_PROFILE,') && secrets.IOS_PROFILE || '' }}
      WINDOWS_CERT_PASSWORD: ${{ contains(matrix.secret_names, ',WINDOWS_CERT_PASSWORD,') && secrets.WINDOWS_CERT_PASSWORD || '' }}
      WINDOWS_CERT_PFX: ${{ contains(matrix.secret_names, ',WINDOWS_CERT_PFX,') && secrets.WINDOWS_CERT_PFX || '' }}
      WRIGHT_SECRET_MACOS_NOTARY_KEY: ${{ contains(matrix.secret_names, ',WRIGHT_SECRET_MACOS_NOTARY_KEY,') && secrets.WRIGHT_SECRET_MACOS_NOTARY_KEY || '' }}
      WRIGHT_SECRET_MACOS_NOTARY_KEY_ID: ${{ contains(matrix.secret_names, ',WRIGHT_SECRET_MACOS_NOTARY_KEY_ID,') && secrets.WRIGHT_SECRET_MACOS_NOTARY_KEY_ID || '' }}
      WRIGHT_SECRET_MACOS_P12: ${{ contains(matrix.secret_names, ',WRIGHT_SECRET_MACOS_P12,') && secrets.WRIGHT_SECRET_MACOS_P12 || '' }}
      WRIGHT_SECRET_MACOS_P12_PASSWORD: ${{ contains(matrix.secret_names, ',WRIGHT_SECRET_MACOS_P12_PASSWORD,') && secrets.WRIGHT_SECRET_MACOS_P12_PASSWORD || '' }}
      WRIGHT_SECRET_MACOS_SIGNING_IDENTITY: ${{ contains(matrix.secret_names, ',WRIGHT_SECRET_MACOS_SIGNING_IDENTITY,') && secrets.WRIGHT_SECRET_MACOS_SIGNING_IDENTITY || '' }}
      WRIGHT_SECRET_MACOS_TEAM_ID: ${{ contains(matrix.secret_names, ',WRIGHT_SECRET_MACOS_TEAM_ID,') && secrets.WRIGHT_SECRET_MACOS_TEAM_ID || '' }}
      WRIGHT_SECRET_WINDOWS_PFX: ${{ contains(matrix.secret_names, ',WRIGHT_SECRET_WINDOWS_PFX,') && secrets.WRIGHT_SECRET_WINDOWS_PFX || '' }}
      WRIGHT_SECRET_WINDOWS_PFX_PASSWORD: ${{ contains(matrix.secret_names, ',WRIGHT_SECRET_WINDOWS_PFX_PASSWORD,') && secrets.WRIGHT_SECRET_WINDOWS_PFX_PASSWORD || '' }}
      WRIGHT_SECRET_WRIGHT_RELEASE_SIGNING: ${{ contains(matrix.secret_names, ',WRIGHT_SECRET_WRIGHT_RELEASE_SIGNING,') && secrets.WRIGHT_SECRET_WRIGHT_RELEASE_SIGNING || '' }}
    steps:
      - name: Long paths (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.checkout.fetch_depth }}
          persist-credentials: ${{ matrix.checkout.persist }}
          clean: ${{ matrix.checkout.clean }}
          sparse-checkout: ${{ matrix.checkout.sparse }}

      - name: Python for the runner (GitHub's machines)
        id: py
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          update-environment: false

      - name: Python for the runner (self-host machines)
        id: py_self_host
        if: runner.os != 'macOS'
        # Self-hosted: setup-python may fail there (a tool cache the runner
        # account cannot write — the macOS legs died on exactly that before
        # the brew step existed, 2026-11-12). Continue and fall back to the
        # machine's own python3; if there is none either, the job's own first
        # line says so instead of a preflight dying for the machine's sake.
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          update-environment: false

      - name: Python for the runner (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list python@3.12 >/dev/null 2>&1 || brew install python@3.12

          PY="$(brew --prefix python@3.12)/bin/python3.12"
          [ -x "$PY" ] || { echo "::error::no python3.12 at $PY"; exit 1; }
          "$PY" -c 'import tomllib' || { echo "::error::$PY has no tomllib"; exit 1; }

          # Our own bin dir, so `python3` means 3.12 without relying on where
          # Homebrew puts its unversioned symlinks for a keg-only formula.
          mkdir -p "$RUNNER_TEMP/pybin"
          ln -sf "$PY" "$RUNNER_TEMP/pybin/python3"
          ln -sf "$PY" "$RUNNER_TEMP/pybin/python"

          echo "$RUNNER_TEMP/pybin" >> "$GITHUB_PATH"   # later steps
          export PATH="$RUNNER_TEMP/pybin:$PATH"        # this step

          python3 -V
          python3 -c 'import tomllib; print("tomllib ok")'

      - name: Plan this job
        id: prep
        shell: bash
        env:
          CI_PY: ${{ steps.py.outputs.python-path }}
        run: |
          [ -n "$CI_PY" ] && echo "CI_PY=$CI_PY" >> "$GITHUB_ENV"
          "${CI_PY:-python3}" ci/lib/prepare.py

      - if: steps.prep.outputs.go == 'true' && steps.prep.outputs.java != ''
        uses: actions/setup-java@v4
        with:
          distribution: ${{ steps.prep.outputs.java_dist }}
          java-version: ${{ steps.prep.outputs.java }}

      - if: steps.prep.outputs.go == 'true' && steps.prep.outputs.node != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.prep.outputs.node }}

      - if: steps.prep.outputs.go == 'true' && steps.prep.outputs.gradle != ''
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.prep.outputs.gradle }}

      - if: steps.prep.outputs.go == 'true' && steps.prep.outputs.tools != ''
        uses: taiki-e/install-action@v2
        with:
          tool: ${{ steps.prep.outputs.tools }}

      - if: steps.prep.outputs.go == 'true' && steps.prep.outputs.rust_cache != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.prep.outputs.rust_cache }}
          key: ${{ steps.prep.outputs.rust_cache_key }}

      - if: steps.prep.outputs.go == 'true' && steps.prep.outputs.cache_key != ''
        uses: actions/cache@v4
        with:
          path: ${{ steps.prep.outputs.cache_path }}
          key: ${{ steps.prep.outputs.cache_key }}
          restore-keys: ${{ steps.prep.outputs.cache_restore }}

      - name: AWS credentials (OIDC role)
        if: steps.prep.outputs.go == 'true' && steps.prep.outputs.aws != '' && env.CI_HAS_AWS_ROLE == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.prep.outputs.aws }}

      - name: AWS credentials (access keys)
        if: steps.prep.outputs.go == 'true' && steps.prep.outputs.aws != '' && env.CI_HAS_AWS_ROLE != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.prep.outputs.aws }}

      - if: steps.prep.outputs.go == 'true' && steps.prep.outputs.dl0 == 'true'
        uses: actions/download-artifact@v4
        continue-on-error: ${{ steps.prep.outputs.dl0_soft == 'true' }}
        with:
          name: ${{ steps.prep.outputs.dl0_name }}
          pattern: ${{ steps.prep.outputs.dl0_pattern }}
          path: ${{ steps.prep.outputs.dl0_path }}
          merge-multiple: ${{ steps.prep.outputs.dl0_merge == 'true' }}

      - if: steps.prep.outputs.go == 'true' && steps.prep.outputs.dl1 == 'true'
        uses: actions/download-artifact@v4
        continue-on-error: ${{ steps.prep.outputs.dl1_soft == 'true' }}
        with:
          name: ${{ steps.prep.outputs.dl1_name }}
          pattern: ${{ steps.prep.outputs.dl1_pattern }}
          path: ${{ steps.prep.outputs.dl1_path }}
          merge-multiple: ${{ steps.prep.outputs.dl1_merge == 'true' }}

      - name: ${{ matrix.title }}
        id: main
        if: steps.prep.outputs.go == 'true'
        shell: bash
        env:
          CI_PART: main
        run: |
          "${CI_PY:-python3}" ci/lib/run.py "${{ fromJSON(matrix.job).file }}"

      - name: Android emulator
        if: steps.prep.outputs.go == 'true' && steps.prep.outputs.emulator == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CI_PART: emulator
          CI_JOB_FILE: ${{ fromJSON(matrix.job).file }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        with:
          api-level: ${{ steps.prep.outputs.emu_api_level }}
          arch: ${{ steps.prep.outputs.emu_arch }}
          target: ${{ steps.prep.outputs.emu_target }}
          emulator-options: ${{ steps.prep.outputs.emu_emulator_options }}
          script: python3 ci/lib/run.py "$CI_JOB_FILE"

      - name: Build provenance (Sigstore, keyless)
        if: steps.prep.outputs.go == 'true' && steps.prep.outputs.attest != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.prep.outputs.attest }}

      - name: After
        if: always() && steps.prep.outputs.go == 'true' && steps.prep.outputs.has_final == 'true'
        shell: bash
        env:
          CI_PART: final
        run: |
          "${CI_PY:-python3}" ci/lib/run.py "${{ fromJSON(matrix.job).file }}"

      - if: always() && steps.prep.outputs.go == 'true' && steps.prep.outputs.up0_name != '' && env.CI_UPLOAD_0 == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.up0_name }}
          path: ${{ steps.prep.outputs.up0_path }}
          if-no-files-found: ${{ steps.prep.outputs.up0_ifnf }}
          retention-days: ${{ steps.prep.outputs.up0_days }}
          include-hidden-files: ${{ steps.prep.outputs.up0_hidden == 'true' }}

      - if: always() && steps.prep.outputs.go == 'true' && steps.prep.outputs.up1_name != '' && env.CI_UPLOAD_1 == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.up1_name }}
          path: ${{ steps.prep.outputs.up1_path }}
          if-no-files-found: ${{ steps.prep.outputs.up1_ifnf }}
          retention-days: ${{ steps.prep.outputs.up1_days }}
          include-hidden-files: ${{ steps.prep.outputs.up1_hidden == 'true' }}

      - if: always() && steps.prep.outputs.go == 'true' && steps.prep.outputs.up2_name != '' && env.CI_UPLOAD_2 == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.up2_name }}
          path: ${{ steps.prep.outputs.up2_path }}
          if-no-files-found: ${{ steps.prep.outputs.up2_ifnf }}
          retention-days: ${{ steps.prep.outputs.up2_days }}
          include-hidden-files: ${{ steps.prep.outputs.up2_hidden == 'true' }}

      - if: always() && steps.prep.outputs.go == 'true' && steps.prep.outputs.up3_name != '' && env.CI_UPLOAD_3 == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.up3_name }}
          path: ${{ steps.prep.outputs.up3_path }}
          if-no-files-found: ${{ steps.prep.outputs.up3_ifnf }}
          retention-days: ${{ steps.prep.outputs.up3_days }}
          include-hidden-files: ${{ steps.prep.outputs.up3_hidden == 'true' }}

  approve:
    if: inputs.write_jobs != '[]' && inputs.approval
    runs-on: ubuntu-latest
    environment: release
    steps:
      - run: echo "Approved for publishing by the release environment's reviewer."

  write:
    needs: approve
    if: ${{ !cancelled() && inputs.write_jobs != '[]' && needs.approve.result != 'failure' }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    name: ${{ matrix.title }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: ${{ matrix.timeout }}
    continue-on-error: ${{ matrix.continue_on_error }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.write_jobs) }}
    env:
      CI_INPUTS: ${{ matrix.inputs }}
      CI_MATRIX: ${{ matrix.matrix }}
      CI_JOB: ${{ matrix.job }}
      CI_PROJECT: ${{ matrix.project }}
      CI_VARS: ${{ inputs.vars }}
      CI_GITHUB_TOKEN: ${{ github.token }}
      CI_SECRET_NAMES: ${{ matrix.secret_list }}
      CI_HAS_AWS_ROLE: ${{ secrets.AWS_ROLE_ARN != '' }}
      ANDROID_KEYSTORE: ${{ contains(matrix.secret_names, ',ANDROID_KEYSTORE,') && secrets.ANDROID_KEYSTORE || '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ contains(matrix.secret_names, ',ANDROID_KEYSTORE_PASSWORD,') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      ANDROID_KEY_ALIAS: ${{ contains(matrix.secret_names, ',ANDROID_KEY_ALIAS,') && secrets.ANDROID_KEY_ALIAS || '' }}
      ANDROID_KEY_PASSWORD: ${{ contains(matrix.secret_names, ',ANDROID_KEY_PASSWORD,') && secrets.ANDROID_KEY_PASSWORD || '' }}
      APPLE_DEVELOPER_ID_P12: ${{ contains(matrix.secret_names, ',APPLE_DEVELOPER_ID_P12,') && secrets.APPLE_DEVELOPER_ID_P12 || '' }}
      APPLE_NOTARY_ISSUER: ${{ contains(matrix.secret_names, ',APPLE_NOTARY_ISSUER,') && secrets.APPLE_NOTARY_ISSUER || '' }}
      APPLE_NOTARY_KEY: ${{ contains(matrix.secret_names, ',APPLE_NOTARY_KEY,') && secrets.APPLE_NOTARY_KEY || '' }}
      APPLE_NOTARY_KEY_ID: ${{ contains(matrix.secret_names, ',APPLE_NOTARY_KEY_ID,') && secrets.APPLE_NOTARY_KEY_ID || '' }}
      APPLE_P12_PASSWORD: ${{ contains(matrix.secret_names, ',APPLE_P12_PASSWORD,') && secrets.APPLE_P12_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ contains(matrix.secret_names, ',APPLE_SIGNING_IDENTITY,') && secrets.APPLE_SIGNING_IDENTITY || '' }}
      AWS_ACCESS_KEY_ID: ${{ contains(matrix.secret_names, ',AWS_ACCESS_KEY_ID,') && secrets.AWS_ACCESS_KEY_ID || '' }}
      AWS_ROLE_ARN: ${{ contains(matrix.secret_names, ',AWS_ROLE_ARN,') && secrets.AWS_ROLE_ARN || '' }}
      AWS_SECRET_ACCESS_KEY: ${{ contains(matrix.secret_names, ',AWS_SECRET_ACCESS_KEY,') && secrets.AWS_SECRET_ACCESS_KEY || '' }}
      CARGO_REGISTRY_TOKEN: ${{ contains(matrix.secret_names, ',CARGO_REGISTRY_TOKEN,') && secrets.CARGO_REGISTRY_TOKEN || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ contains(matrix.secret_names, ',CLOUDFLARE_ACCOUNT_ID,') && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
      CLOUDFLARE_API_TOKEN: ${{ contains(matrix.secret_names, ',CLOUDFLARE_API_TOKEN,') && secrets.CLOUDFLARE_API_TOKEN || '' }}
      DEVICE_FARM_PROJECT_ARN: ${{ contains(matrix.secret_names, ',DEVICE_FARM_PROJECT_ARN,') && secrets.DEVICE_FARM_PROJECT_ARN || '' }}
      IOS_CERT_P12: ${{ contains(matrix.secret_names, ',IOS_CERT_P12,') && secrets.IOS_CERT_P12 || '' }}
      IOS_CERT_PASSWORD: ${{ contains(matrix.secret_names, ',IOS_CERT_PASSWORD,') && secrets.IOS_CERT_PASSWORD || '' }}
      IOS_IDENTITY: ${{ contains(matrix.secret_names, ',IOS_IDENTITY,') && secrets.IOS_IDENTITY || '' }}
      IOS_PROFILE: ${{ contains(matrix.secret_names, ',IOS_PROFILE,') && secrets.IOS_PROFILE || '' }}
      WINDOWS_CERT_PASSWORD: ${{ contains(matrix.secret_names, ',WINDOWS_CERT_PASSWORD,') && secrets.WINDOWS_CERT_PASSWORD || '' }}
      WINDOWS_CERT_PFX: ${{ contains(matrix.secret_names, ',WINDOWS_CERT_PFX,') && secrets.WINDOWS_CERT_PFX || '' }}
      WRIGHT_SECRET_MACOS_NOTARY_KEY: ${{ contains(matrix.secret_names, ',WRIGHT_SECRET_MACOS_NOTARY_KEY,') && secrets.WRIGHT_SECRET_MACOS_NOTARY_KEY || '' }}
      WRIGHT_SECRET_MACOS_NOTARY_KEY_ID: ${{ contains(matrix.secret_names, ',WRIGHT_SECRET_MACOS_NOTARY_KEY_ID,') && secrets.WRIGHT_SECRET_MACOS_NOTARY_KEY_ID || '' }}
      WRIGHT_SECRET_MACOS_P12: ${{ contains(matrix.secret_names, ',WRIGHT_SECRET_MACOS_P12,') && secrets.WRIGHT_SECRET_MACOS_P12 || '' }}
      WRIGHT_SECRET_MACOS_P12_PASSWORD: ${{ contains(matrix.secret_names, ',WRIGHT_SECRET_MACOS_P12_PASSWORD,') && secrets.WRIGHT_SECRET_MACOS_P12_PASSWORD || '' }}
      WRIGHT_SECRET_MACOS_SIGNING_IDENTITY: ${{ contains(matrix.secret_names, ',WRIGHT_SECRET_MACOS_SIGNING_IDENTITY,') && secrets.WRIGHT_SECRET_MACOS_SIGNING_IDENTITY || '' }}
      WRIGHT_SECRET_MACOS_TEAM_ID: ${{ contains(matrix.secret_names, ',WRIGHT_SECRET_MACOS_TEAM_ID,') && secrets.WRIGHT_SECRET_MACOS_TEAM_ID || '' }}
      WRIGHT_SECRET_WINDOWS_PFX: ${{ contains(matrix.secret_names, ',WRIGHT_SECRET_WINDOWS_PFX,') && secrets.WRIGHT_SECRET_WINDOWS_PFX || '' }}
      WRIGHT_SECRET_WINDOWS_PFX_PASSWORD: ${{ contains(matrix.secret_names, ',WRIGHT_SECRET_WINDOWS_PFX_PASSWORD,') && secrets.WRIGHT_SECRET_WINDOWS_PFX_PASSWORD || '' }}
      WRIGHT_SECRET_WRIGHT_RELEASE_SIGNING: ${{ contains(matrix.secret_names, ',WRIGHT_SECRET_WRIGHT_RELEASE_SIGNING,') && secrets.WRIGHT_SECRET_WRIGHT_RELEASE_SIGNING || '' }}
    steps:
      - name: Long paths (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.checkout.fetch_depth }}
          persist-credentials: ${{ matrix.checkout.persist }}
          clean: ${{ matrix.checkout.clean }}
          sparse-checkout: ${{ matrix.checkout.sparse }}

      - name: Python for the runner (GitHub's machines)
        id: py
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          update-environment: false

      - name: Python for the runner (self-host machines)
        id: py_self_host
        if: runner.os != 'macOS'
        # Self-hosted: setup-python may fail there (a tool cache the runner
        # account cannot write — the macOS legs died on exactly that before
        # the brew step existed, 2026-11-12). Continue and fall back to the
        # machine's own python3; if there is none either, the job's own first
        # line says so instead of a preflight dying for the machine's sake.
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          update-environment: false

      - name: Python for the runner (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list python@3.12 >/dev/null 2>&1 || brew install python@3.12

          PY="$(brew --prefix python@3.12)/bin/python3.12"
          [ -x "$PY" ] || { echo "::error::no python3.12 at $PY"; exit 1; }
          "$PY" -c 'import tomllib' || { echo "::error::$PY has no tomllib"; exit 1; }

          # Our own bin dir, so `python3` means 3.12 without relying on where
          # Homebrew puts its unversioned symlinks for a keg-only formula.
          mkdir -p "$RUNNER_TEMP/pybin"
          ln -sf "$PY" "$RUNNER_TEMP/pybin/python3"
          ln -sf "$PY" "$RUNNER_TEMP/pybin/python"

          echo "$RUNNER_TEMP/pybin" >> "$GITHUB_PATH"   # later steps
          export PATH="$RUNNER_TEMP/pybin:$PATH"        # this step

          python3 -V
          python3 -c 'import tomllib; print("tomllib ok")'

      - name: Plan this job
        id: prep
        shell: bash
        env:
          CI_PY: ${{ steps.py.outputs.python-path }}
        run: |
          [ -n "$CI_PY" ] && echo "CI_PY=$CI_PY" >> "$GITHUB_ENV"
          "${CI_PY:-python3}" ci/lib/prepare.py

      - if: steps.prep.outputs.go == 'true' && steps.prep.outputs.java != ''
        uses: actions/setup-java@v4
        with:
          distribution: ${{ steps.prep.outputs.java_dist }}
          java-version: ${{ steps.prep.outputs.java }}

      - if: steps.prep.outputs.go == 'true' && steps.prep.outputs.node != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.prep.outputs.node }}

      - if: steps.prep.outputs.go == 'true' && steps.prep.outputs.gradle != ''
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.prep.outputs.gradle }}

      - if: steps.prep.outputs.go == 'true' && steps.prep.outputs.tools != ''
        uses: taiki-e/install-action@v2
        with:
          tool: ${{ steps.prep.outputs.tools }}

      - if: steps.prep.outputs.go == 'true' && steps.prep.outputs.rust_cache != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.prep.outputs.rust_cache }}
          key: ${{ steps.prep.outputs.rust_cache_key }}

      - if: steps.prep.outputs.go == 'true' && steps.prep.outputs.cache_key != ''
        uses: actions/cache@v4
        with:
          path: ${{ steps.prep.outputs.cache_path }}
          key: ${{ steps.prep.outputs.cache_key }}
          restore-keys: ${{ steps.prep.outputs.cache_restore }}

      - name: AWS credentials (OIDC role)
        if: steps.prep.outputs.go == 'true' && steps.prep.outputs.aws != '' && env.CI_HAS_AWS_ROLE == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.prep.outputs.aws }}

      - name: AWS credentials (access keys)
        if: steps.prep.outputs.go == 'true' && steps.prep.outputs.aws != '' && env.CI_HAS_AWS_ROLE != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.prep.outputs.aws }}

      - if: steps.prep.outputs.go == 'true' && steps.prep.outputs.dl0 == 'true'
        uses: actions/download-artifact@v4
        continue-on-error: ${{ steps.prep.outputs.dl0_soft == 'true' }}
        with:
          name: ${{ steps.prep.outputs.dl0_name }}
          pattern: ${{ steps.prep.outputs.dl0_pattern }}
          path: ${{ steps.prep.outputs.dl0_path }}
          merge-multiple: ${{ steps.prep.outputs.dl0_merge == 'true' }}

      - if: steps.prep.outputs.go == 'true' && steps.prep.outputs.dl1 == 'true'
        uses: actions/download-artifact@v4
        continue-on-error: ${{ steps.prep.outputs.dl1_soft == 'true' }}
        with:
          name: ${{ steps.prep.outputs.dl1_name }}
          pattern: ${{ steps.prep.outputs.dl1_pattern }}
          path: ${{ steps.prep.outputs.dl1_path }}
          merge-multiple: ${{ steps.prep.outputs.dl1_merge == 'true' }}

      - name: ${{ matrix.title }}
        id: main
        if: steps.prep.outputs.go == 'true'
        shell: bash
        env:
          CI_PART: main
        run: |
          "${CI_PY:-python3}" ci/lib/run.py "${{ fromJSON(matrix.job).file }}"

      - name: Android emulator
        if: steps.prep.outputs.go == 'true' && steps.prep.outputs.emulator == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CI_PART: emulator
          CI_JOB_FILE: ${{ fromJSON(matrix.job).file }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        with:
          api-level: ${{ steps.prep.outputs.emu_api_level }}
          arch: ${{ steps.prep.outputs.emu_arch }}
          target: ${{ steps.prep.outputs.emu_target }}
          emulator-options: ${{ steps.prep.outputs.emu_emulator_options }}
          script: python3 ci/lib/run.py "$CI_JOB_FILE"

      - name: Build provenance (Sigstore, keyless)
        if: steps.prep.outputs.go == 'true' && steps.prep.outputs.attest != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.prep.outputs.attest }}

      - name: After
        if: always() && steps.prep.outputs.go == 'true' && steps.prep.outputs.has_final == 'true'
        shell: bash
        env:
          CI_PART: final
        run: |
          "${CI_PY:-python3}" ci/lib/run.py "${{ fromJSON(matrix.job).file }}"

      - if: always() && steps.prep.outputs.go == 'true' && steps.prep.outputs.up0_name != '' && env.CI_UPLOAD_0 == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.up0_name }}
          path: ${{ steps.prep.outputs.up0_path }}
          if-no-files-found: ${{ steps.prep.outputs.up0_ifnf }}
          retention-days: ${{ steps.prep.outputs.up0_days }}
          include-hidden-files: ${{ steps.prep.outputs.up0_hidden == 'true' }}

      - if: always() && steps.prep.outputs.go == 'true' && steps.prep.outputs.up1_name != '' && env.CI_UPLOAD_1 == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.up1_name }}
          path: ${{ steps.prep.outputs.up1_path }}
          if-no-files-found: ${{ steps.prep.outputs.up1_ifnf }}
          retention-days: ${{ steps.prep.outputs.up1_days }}
          include-hidden-files: ${{ steps.prep.outputs.up1_hidden == 'true' }}

      - if: always() && steps.prep.outputs.go == 'true' && steps.prep.outputs.up2_name != '' && env.CI_UPLOAD_2 == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.up2_name }}
          path: ${{ steps.prep.outputs.up2_path }}
          if-no-files-found: ${{ steps.prep.outputs.up2_ifnf }}
          retention-days: ${{ steps.prep.outputs.up2_days }}
          include-hidden-files: ${{ steps.prep.outputs.up2_hidden == 'true' }}

      - if: always() && steps.prep.outputs.go == 'true' && steps.prep.outputs.up3_name != '' && env.CI_UPLOAD_3 == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.up3_name }}
          path: ${{ steps.prep.outputs.up3_path }}
          if-no-files-found: ${{ steps.prep.outputs.up3_ifnf }}
          retention-days: ${{ steps.prep.outputs.up3_days }}
          include-hidden-files: ${{ steps.prep.outputs.up3_hidden == 'true' }}
