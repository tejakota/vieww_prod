# GENERATED by .github/entry/entries.py from .github/entry/plan.py: edit those, not this.
#
# Device · Machines: your own Linux, Windows and macOS machines.
# The other forms: Cloud VM · Machines, Cloud VM · Mobile, Device · Mobile. Nothing in this repository runs any other
# way: not on a push, a pull request, a schedule or another run.
#
# Tick what to run; the `└` fields under an item choose its steps and
# options. The run's summary starts with exactly what was chosen.

name: "Device · Machines"

on:
  workflow_dispatch:
    inputs:
      feature:
        description: "Feature run: the checks for what this branch changed"
        type: boolean
        default: false
      feature_areas:
        description: "  └ areas"
        type: choice
        options:
          - "auto (from the branch's changes)"
          - "framework"
          - "wright"
          - "studio"
          - "prototype"
          - "all"
        default: "auto (from the branch's changes)"
      feature_depth:
        description: "  └ depth"
        type: choice
        options:
          - "quick"
          - "full"
        default: "quick"
      hardware_linux:
        description: "Hardware: Linux"
        type: boolean
        default: false
      hardware_windows:
        description: "Hardware: Windows"
        type: boolean
        default: false
      hardware_macos:
        description: "Hardware: macOS"
        type: boolean
        default: false
      hardware_scope:
        description: "  └ which hardware steps"
        type: choice
        options:
          - "all"
          - "gpu"
          - "visual (gallery, baseline)"
          - "performance (size, stress)"
          - "desktop (windows, audio)"
        default: "all"
      hardware_launches:
        description: "  └ launches per timing"
        type: choice
        options:
          - "5"
          - "3"
          - "1"
          - "10"
        default: "5"
      release_gate_device:
        description: "Release gate on your machines"
        type: boolean
        default: false
      release_gate_linux_cpu:
        description: "  └ Linux CPU"
        type: boolean
        default: true
      release_gate_linux_gpu:
        description: "  └ Linux GPU"
        type: boolean
        default: true
      release_gate_windows_gpu:
        description: "  └ Windows GPU"
        type: boolean
        default: true
      release_gate_device_scope:
        description: "  └ scope"
        type: choice
        options:
          - "gate"
          - "checks"
          - "screenshots"
        default: "gate"
      release_gate_device_rerun:
        description: "  └ rerun"
        type: choice
        options:
          - "failed"
          - "all"
        default: "failed"
      release_gate_device_package:
        description: "  └ build installers"
        type: boolean
        default: true
      advanced:
        description: "Optional, for what the boxes don't offer: item:step key=value; … (see .github/workflows/README.md)"
        type: string
        default: ""
      save_results:
        description: "Save this run's results to the ci-results branch"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      feature: ${{ steps.plan.outputs.feature }}
      feature_areas: ${{ steps.plan.outputs.feature_areas }}
      feature_depth: ${{ steps.plan.outputs.feature_depth }}
      hardware_any: ${{ steps.plan.outputs.hardware_any }}
      hardware_launches: ${{ steps.plan.outputs.hardware_launches }}
      hardware_linux: ${{ steps.plan.outputs.hardware_linux }}
      hardware_linux_steps: ${{ steps.plan.outputs.hardware_linux_steps }}
      hardware_macos: ${{ steps.plan.outputs.hardware_macos }}
      hardware_macos_steps: ${{ steps.plan.outputs.hardware_macos_steps }}
      hardware_windows: ${{ steps.plan.outputs.hardware_windows }}
      hardware_windows_steps: ${{ steps.plan.outputs.hardware_windows_steps }}
      release_gate_device: ${{ steps.plan.outputs.release_gate_device }}
      release_gate_device_legs: ${{ steps.plan.outputs.release_gate_device_legs }}
      release_gate_device_package: ${{ steps.plan.outputs.release_gate_device_package }}
      release_gate_device_rerun: ${{ steps.plan.outputs.release_gate_device_rerun }}
      release_gate_device_scope: ${{ steps.plan.outputs.release_gate_device_scope }}
      save_results: ${{ steps.plan.outputs.save_results }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/entry
      - id: plan
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: python3 .github/entry/plan.py device-machines

  feature:
    name: "feature run"
    needs: plan
    if: needs.plan.outputs.feature == 'true'
    uses: ./.github/workflows/device-machines-feature.yml
    with:
      areas: ${{ needs.plan.outputs.feature_areas }}
      depth: ${{ needs.plan.outputs.feature_depth }}
    secrets: inherit

  hardware:
    name: "hardware"
    needs: plan
    if: needs.plan.outputs.hardware_any == 'true'
    uses: ./.github/workflows/device-machines-hardware.yml
    with:
      linux: ${{ needs.plan.outputs.hardware_linux == 'true' }}
      windows: ${{ needs.plan.outputs.hardware_windows == 'true' }}
      macos: ${{ needs.plan.outputs.hardware_macos == 'true' }}
      linux_steps: ${{ needs.plan.outputs.hardware_linux_steps }}
      windows_steps: ${{ needs.plan.outputs.hardware_windows_steps }}
      macos_steps: ${{ needs.plan.outputs.hardware_macos_steps }}
      launches: ${{ needs.plan.outputs.hardware_launches }}
    secrets: inherit
    permissions:
      contents: write

  release_gate:
    name: "release gate (your machines)"
    needs: plan
    if: needs.plan.outputs.release_gate_device == 'true'
    uses: ./.github/workflows/shared-release-gate.yml
    with:
      legs: ${{ needs.plan.outputs.release_gate_device_legs }}
      scope: ${{ needs.plan.outputs.release_gate_device_scope }}
      rerun: ${{ needs.plan.outputs.release_gate_device_rerun }}
      package: ${{ needs.plan.outputs.release_gate_device_package == 'true' }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      attestations: write

  results:
    name: save results
    needs: [plan, feature, hardware, release_gate]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.save_results == 'true'
    uses: ./.github/workflows/shared-results.yml
    with:
      run_id: ${{ github.run_id }}
      workflow: ${{ github.workflow }}
      conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
    permissions:
      contents: write
      actions: read
