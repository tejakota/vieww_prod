# vieww Studio's own suite on every desktop OS (ST-12).
#
# Before this, one Studio test file (`--test remote`) ran in CI, on one OS.
# This workflow runs everything that needs no self-hosted machine:
#
#   * `cargo test -p viewwstudio`: the unit and integration suites. The
#     pipeline tests skip themselves when the SDK rlibs are missing, as
#     `tests/pipeline.rs` documents;
#   * `ci/standalone.sh`: the std-only modules, compiled with rustc alone;
#   * the `screenshot` example: the real UI rendered headless to a PNG,
#     checked to exist and to be a PNG;
#   * the Spanish screenshot (ST-16): the same capture with
#     `VIEWWSTUDIO_LANG=es`, uploaded beside the English one.
#
# Started by hand, like every workflow here: Actions -> Studio -> Run
# workflow. Results land on the `ci-results` branch.

name: Studio

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Test binaries without debug info: the full suite links ~30 of them.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash
    working-directory: vieww_base

jobs:
  suite:
    name: Studio suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries the window code links
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libfontconfig1-dev
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vieww_base/target
          key: studio-${{ runner.os }}-${{ hashFiles('vieww_base/Cargo.lock') }}
      - name: Unit and integration tests
        run: cargo test -p viewwstudio --lib --tests -- --test-threads=4
      - name: The std-only modules with rustc alone
        if: runner.os != 'Windows'
        run: bash apps/viewwstudio/ci/standalone.sh
      - name: Screenshot, English and Spanish
        run: |
          out="$RUNNER_TEMP/studio-shots"
          mkdir -p "$out"
          cargo run -q -p viewwstudio --example screenshot -- "$out/studio-en.png"
          VIEWWSTUDIO_LANG=es cargo run -q -p viewwstudio --example screenshot -- "$out/studio-es.png"
          for f in "$out"/studio-en.png "$out"/studio-es.png; do
            test -s "$f" || { echo "::error::$f was not written"; exit 1; }
            head -c 8 "$f" | od -An -tx1 | tr -d " \n" | grep -q "89504e470d0a1a0a" || { echo "::error::$f is not a PNG"; exit 1; }
          done
          cmp -s "$out/studio-en.png" "$out/studio-es.png" && echo "::warning::the Spanish capture is identical to the English one (does the captured screen show translated chrome?)" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-screenshots-${{ matrix.os }}
          path: ${{ runner.temp }}/studio-shots
          if-no-files-found: ignore
