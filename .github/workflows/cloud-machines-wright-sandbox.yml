# ─────────────────────────────────────────────────────────────────────
# Part of cloud-vm.yml (Cloud VM) · Machines · `wright_sandbox`.
# No trigger of its own: tick it on the entry's Run workflow form.
# Steps for the entry's `steps` field: linux-escape-suite macos-seatbelt-suite windows-doctor-fix windows-fail-closed
# ─────────────────────────────────────────────────────────────────────

# wright(WR-03/WR-05): the sandbox suites on every OS they can run on.
#
# The macOS Seatbelt backend (sandbox_macos.rs) is written-not-run by the
# house pattern for Apple paths; THIS workflow is where it stops being
# that — the hosted macOS runner is a cloud VM (in scope), executes the
# whole Seatbelt suite, and every test that fails says exactly which
# policy line drifted. The Linux leg runs the full escape suite (WR-01/02
# regressions, seccomp probes, scratch 0700), including once with
# WRIGHT_SANDBOX_NO_PIDNS=1 (the fallback path CI runs both ways). The
# Windows leg is the fail-closed probe set (no WSL on the hosted runner;
# the real WSL2 suite lives on the self-hosted machine per
# docs/infra/SELF-HOSTED-SETUP.md).
#
# Manual dispatch only, per the owner's rule (2026-10-24). Dispatch it
# after applying the gap-closing patches; results publish to the
# ci-results branch through the same mechanism the other workflows use.

name: Wright sandbox suites

on:
  workflow_call:
    inputs:
      profile:
        description: "Cargo profile for the Linux leg"
        type: string
        default: "debug"
      only:
        description: "Steps (job ids) to run, space-separated; empty = all. Jobs a chosen step needs run too."
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux-escape-suite:
    if: (inputs.only == '' || contains(format(' {0} ', inputs.only), ' linux-escape-suite '))
    name: Linux — full escape suite (Landlock + seccomp)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: vieww_base/apps/wright
      - name: Landlock ABI guard
        run: |
          # ubuntu-24.04 kernels (6.8) carry Landlock ABI 4+ (network rules).
          uname -r
      - name: Sandbox escape suite
        working-directory: vieww_base/apps/wright
        run: cargo test -p wright-tools --lib sandbox
      - name: The same suite without user namespaces (the fallback path)
        working-directory: vieww_base/apps/wright
        env:
          WRIGHT_SANDBOX_NO_PIDNS: "1"
        run: cargo test -p wright-tools --lib sandbox
      - name: Escape suite receipts
        if: always()
        run: |
          mkdir -p receipts/wright/linux
          printf 'linux escape suite: see the job log\n' > receipts/wright/linux/SUMMARY.txt

  macos-seatbelt-suite:
    if: (inputs.only == '' || contains(format(' {0} ', inputs.only), ' macos-seatbelt-suite '))
    name: macOS — Seatbelt suite (WR-03)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: vieww_base/apps/wright
      - name: Seatbelt is present
        run: test -x /usr/bin/sandbox-exec && /usr/bin/sandbox-exec -f /dev/null /usr/bin/true || true
      - name: The Seatbelt suite (policy + runtime)
        working-directory: vieww_base/apps/wright
        run: cargo test -p wright-tools --lib sandbox  # the macos cfg compiles sandbox_macos.rs; its tests run here
      - name: doctor reports the capability
        working-directory: vieww_base/apps/wright
        run: cargo run -p wright -- doctor || true

  windows-fail-closed:
    if: (inputs.only == '' || contains(format(' {0} ', inputs.only), ' windows-fail-closed '))
    name: Windows — probe fail-closed (no WSL on the runner)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: vieww_base/apps/wright
      - name: Sandbox refuses cleanly without WSL2
        working-directory: vieww_base/apps/wright
        run: cargo test -p wright-tools --lib sandbox_windows -- --ignored --test-threads=1 || cargo test -p wright-tools --lib sandbox
      - name: Credential Manager round trip (WR-06)
        working-directory: vieww_base/apps/wright
        run: cargo test -p wright-runtime wincred -- --test-threads=1
      - name: Worker Job objects (WR-05) — tree killed with the job, process cap
        working-directory: vieww_base/apps/wright
        run: cargo test -p wright-tools winjob -- --test-threads=1
      - name: Worker AppContainer (WR-05 tier 2) — escape suite, env, timeout
        working-directory: vieww_base/apps/wright
        run: cargo test -p wright-tools appcontainer -- --test-threads=1
      # WR-05's leftover: npm .cmd shims stay tier 1 (Job object, no
      # filesystem sandbox). This leg is the promise made real: the shim
      # runs, and its report SAYS tier 1 — never silently unsandboxed.
      # The whole worker suite runs (the tier-vocabulary test is in it);
      # --test-threads=1 because the Job-object tests adopt processes.
      - name: Worker tier report (WR-05) — .cmd shims say tier 1, never silently unsandboxed
        working-directory: vieww_base/apps/wright
        run: cargo test -p wright-tools worker -- --test-threads=1

  windows-doctor-fix:
    if: (inputs.only == '' || contains(format(' {0} ', inputs.only), ' windows-doctor-fix '))
    # WR-14: the doctor --fix machinery and the degraded native tiers.
    # The plan/matrix/script-pinning tests run on every OS, but this leg
    # is where resolve_native actually resolves Windows binaries (git.exe
    # is on the runner), the tier vocabulary is pinned against the worker
    # ladder, and the bootstrap script is PARSED by a real Windows
    # PowerShell — a syntax check the Linux sandbox cannot give. The full
    # bootstrap (UAC elevation, WSL install, apt) needs a rebootable,
    # persistent machine: that leg is the self-hosted Windows box per
    # docs/infra/SELF-HOSTED-SETUP.md; this hosted leg checks everything
    # short of it.
    name: Windows — doctor --fix machinery + degraded tiers (WR-14)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: vieww_base/apps/wright
      - name: The fix plan, matrix and script pin (WR-14a/c)
        working-directory: vieww_base/apps/wright
        run: cargo test -p wright-tools --lib setup -- --test-threads=1
      - name: The degraded native tiers (WR-14b) — resolution + vocabulary
        working-directory: vieww_base/apps/wright
        run: cargo test -p wright-tools --lib degraded -- --test-threads=1
      - name: The bootstrap script parses under Windows PowerShell
        shell: powershell
        working-directory: vieww_base/apps/wright/packaging/windows
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path './bootstrap-wsl.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Host ("parse error: " + $_.Message) }
            exit 1
          }
          Write-Host 'bootstrap-wsl.ps1 parses cleanly'
      - name: doctor prints the isolation matrix (WR-14c)
        working-directory: vieww_base/apps/wright
        run: |
          cargo run -q -p wright -- doctor > doctor.txt || true
          grep -c 'isolation matrix' doctor.txt
          grep -E 'shell|git|run-tests' doctor.txt | head -5
