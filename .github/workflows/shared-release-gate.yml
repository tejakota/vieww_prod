# ─────────────────────────────────────────────────────────────────────
# Part of cloud-vm.yml and device.yml · Machines · `release_gate*`.
# No trigger of its own: tick it on the entry's Run workflow form.
# Cloud VM's `release_gate` runs the hosted legs, Device's
# `release_gate_device` the self-hosted ones. Steps are leg ids, plus
# scope=gate|checks|screenshots rerun=failed|all package=true|false.
# ─────────────────────────────────────────────────────────────────────

# ROOT COPY (FW-02). GitHub only reads workflows from the repository root, so
# the release gate that used to sit, unread, at
# vieww_base/.github/workflows/ci.yml lives here. Differences from that file:
# every `run:` executes inside vieww_base/ and artifact paths carry the
# vieww_base/ prefix. Named shared-release-gate.yml so it does not collide with the
# root cloud-mobile-apps.yml ("Build Mobile Apps").
#
# Windows and macOS legs of the beta release gate, on GitHub-hosted runners.
#
# Linux runs on a real machine (`ci/vieww gate --mode cpu`, then `--mode gpu`),
# because that is where a real GPU and display are. These runners have neither,
# so this workflow is the CPU pass only: every build, test, suite, screenshot
# and installer, with GPU execution and the real-window desktop suite recorded
# as SKIPPED rather than pretended.
#
# **Every leg of the sign-off is in this file**, the Linux and Windows
# self-hosted ones included, so the release gate is described in one place
# rather than half here and half in somebody's shell history. The `plan` job at
# the top decides which of them a given run executes, and prints why on the
# summary page — see the comment above it. The short version:
#
#   push to main       hosted legs, each leg's outstanding rows only
#   `v*` tag           hosted legs, the whole gate, every row
#   Run workflow       `legs` picks the machines (hosted | all | none | a
#                      comma list), `rerun` picks failed rows or everything
#
# A leg whose `rows` list is empty is skipped on a rerun: that is what keeps a
# test push from repeating work that already passed.
# It never runs on pull requests: this repository is public, and a pull request
# from a fork must not get a multi-hour job, or any job with write access.
#
# Results:
#   gate-<leg>                  run folders (CHECKLIST.md, logs, evidence)
#   screenshots-<leg>           five feature and five studio pictures
#   installers-windows-cpu/-macos-cpu   .msi/.zip, .dmg, SHA256SUMS, MANIFEST.txt
#   checklist-ci                both runs merged into one CHECKLIST-ci.md
#                               (also shown on the run's summary page)
#
# Merge with the local Linux runs:
#   ci/vieww checklist target/release-gate/linux-cpu-* target/release-gate/linux-gpu-* \
#       gate-windows-cpu/ gate-macos-cpu/ gate-macos-gpu/ gate-linux-export/ -o CHECKLIST.md

name: release-gate

# Manual only, by the owner's rule (2026-10-26): no push, pull_request,
# tag or schedule trigger. Actions -> this workflow -> Run workflow.
on:
  workflow_call:
    inputs:
      scope:
        description: "gate = everything; checks = fmt/clippy/docs/tests only; screenshots = just the ten pictures (minutes, no gate)"
        type: string
        default: "gate"
      rerun:
        description: "failed = only the rows that failed last time (see RERUN LISTS below); all = full gate"
        type: string
        default: "failed"
      package:
        description: "Build installers"
        type: boolean
        default: true
      legs:
        description: "Which machines: hosted (default) | all | none | a comma list of leg ids (see LEGS below), e.g. windows-cpu,macos-gpu"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── THE GATE AT THE TOP ─────────────────────────────────────────────────
  #
  # Every leg of the release sign-off is described below, the Linux ones
  # included, so this file is the whole picture rather than the part that
  # happens to run on GitHub's machines. What actually runs is decided here,
  # once, and the reasons are printed on the run's summary page.
  #
  # Three questions, in order:
  #
  #  1. **Which machines?** `legs` — `hosted` (the default: GitHub's runners),
  #     `all` (adds the self-hosted Linux and Windows legs), `none`, or a comma
  #     list of leg ids. The self-hosted legs are never picked by default: with
  #     no runner registered for those labels a job queues for six hours and
  #     then fails, which is worse than not running it.
  #  2. **Which rows?** `rerun` — `failed` uses each leg's `rows` list below,
  #     `all` runs the whole gate. A `v*` tag always runs everything: a
  #     certification with rows carried over from a previous commit is not a
  #     certification.
  #  3. **Is there anything left?** A leg whose `rows` list is empty has
  #     nothing outstanding, so on `rerun: failed` it is skipped rather than
  #     repeating work that already passed. **That is the dedupe**: as a row
  #     starts passing, delete it from its leg's list; when the list is empty
  #     the leg stops running during testing, and still runs in full for the
  #     tag.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          LEGS: ${{ inputs.legs }}
          RERUN: ${{ inputs.rerun }}
          SCOPE_IN: ${{ inputs.scope }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          # ── LEGS ────────────────────────────────────────────────────────
          # One entry per machine the sign-off needs.
          #
          #   hosted     false = a self-hosted runner with these labels, so it
          #              is opt-in (`legs: all`, or named).
          #   headless   true  = no display and no GPU: the desktop suite and
          #              the GPU stages record SKIPPED rather than pretending.
          #   rows       what `rerun: failed` executes. "" = nothing
          #              outstanding, so the leg is skipped on a rerun.
          #              "*" = this leg has never passed anything; run it whole.
          LEGS = [
              # Linux, on the machine with a real GPU and a real display. The
              # only leg that can answer G1.4, G1.5, G1.10 and G1.14 with
              # hardware rather than a skip.
              {
                  "id": "linux-cpu",
                  "os": "linux",
                  "runner": ["self-hosted", "linux", "vieww-gate"],
                  "mode": "cpu",
                  "hosted": False,
                  "headless": False,
                  "rows": "G0.5,G1.1,G1.3,G3.1",
              },
              {
                  "id": "linux-gpu",
                  "os": "linux",
                  "runner": ["self-hosted", "linux", "vieww-gate", "gpu"],
                  "mode": "gpu",
                  "hosted": False,
                  "headless": False,
                  "vk_device": "nvidia",
                  "rows": "*",
              },
              # Outstanding as of the 2026-09-18 run: the studio's tests
              # spawning `/bin/sh` (G1.1, and G1.3 through the same suite) and
              # the MSI (G3.1, with G8.1 behind it). Everything else on this
              # machine has passed.
              {
                  "id": "windows-cpu",
                  "os": "windows",
                  "runner": "windows-latest",
                  "mode": "cpu",
                  "hosted": True,
                  "headless": True,
                  "rows": "G1.1,G1.3,G3.1",
              },
              # Windows on real hardware: D3D12 and the desktop suite, which
              # the hosted image cannot run. Opt-in like the Linux legs.
              {
                  "id": "windows-gpu",
                  "os": "windows",
                  "runner": ["self-hosted", "windows", "vieww-gate", "gpu"],
                  "mode": "gpu",
                  "hosted": False,
                  "headless": False,
                  "rows": "*",
              },
              {
                  "id": "macos-cpu",
                  "os": "macos",
                  "runner": "macos-latest",
                  "mode": "cpu",
                  "hosted": True,
                  "headless": True,
                  "rows": "",
              },
              # Apple's paravirtualized GPU through MoltenVK — the only test of
              # the Vulkan parity suite and census on that path. Its pixels are
              # evidence; its timings are not.
              {
                  "id": "macos-gpu",
                  "os": "macos",
                  "runner": "macos-latest",
                  "mode": "gpu",
                  "hosted": True,
                  "headless": True,
                  "rows": "",
              },
              # The hosted Ubuntu image carries the Android SDK, NDK and JDK a
              # laptop may not, so the export route is proved here. G2.7-G2.11
              # passed on 2026-09-18, so the list is empty and reruns skip it;
              # `rerun: all` and the tag still run it, and `full_rows` is what
              # it runs then.
              {
                  "id": "linux-export",
                  "os": "linux",
                  "runner": "ubuntu-latest",
                  "mode": "cpu",
                  "hosted": True,
                  "headless": True,
                  "export_only": True,
                  "rows": "",
                  "full_rows": "G2.7,G2.8,G2.9,G2.10,G2.11",
              },
          ]

          event = os.environ["EVENT"]
          ref = os.environ["REF"]
          tag = ref.startswith("refs/tags/")
          wanted = (os.environ.get("LEGS") or "").strip().lower()
          rerun = (os.environ.get("RERUN") or "").strip() or ("failed" if event == "push" and not tag else "all")
          # A tag is the certification: everything, on every machine that is
          # available, whatever the lists say.
          if tag:
              rerun = "all"

          if not wanted:
              wanted = "hosted"

          # `scope: screenshots` takes ten pictures and runs no gate row at
          # all — minutes rather than hours, for the question "does this
          # machine draw the product correctly", which is what sent somebody
          # looking at a macOS build with no text on its buttons. Only the CPU
          # legs draw them (a GPU leg's pictures would be the same ones), so
          # the rest are not started.
          scope = (os.environ.get("SCOPE_IN") or "").strip() or "gate"
          if os.environ["EVENT"] == "push":
              scope = "gate"

          chosen, skipped = [], []
          for leg in LEGS:
              if scope == "screenshots" and (leg["mode"] != "cpu" or leg.get("export_only")):
                  skipped.append((leg["id"], "draws no screenshots"))
                  continue
              if wanted == "none":
                  skipped.append((leg["id"], "legs: none"))
                  continue
              if wanted == "hosted" and not leg["hosted"]:
                  skipped.append((leg["id"], "self-hosted; pass legs: all or name it"))
                  continue
              if wanted not in ("hosted", "all"):
                  named = [x.strip() for x in wanted.split(",") if x.strip()]
                  if leg["id"] not in named:
                      skipped.append((leg["id"], "not named in legs"))
                      continue

              rows = leg.get("rows", "*")
              only = ""
              if scope == "screenshots":
                  chosen.append({**leg, "only": "", "export_only": False,
                                 "vk_device": "", "headless": "1" if leg.get("headless") else ""})
                  continue
              # An outstanding list is also what a leg runs on a rerun, so
              # `linux-cpu`'s list below is this laptop's, not a CI machine's.
              if rerun == "failed":
                  if rows == "":
                      skipped.append((leg["id"], "nothing outstanding (rows is empty)"))
                      continue
                  if rows != "*":
                      only = rows
              # An export-only leg never runs anything but its own rows, even
              # in a full run: the rest of the gate is another leg's job, and a
              # full pass here would build the whole workspace twice.
              if leg.get("export_only"):
                  rows_full = leg.get("full_rows") or leg.get("rows")
                  if rows_full not in ("", "*"):
                      only = rows_full

              entry = dict(leg)
              entry["only"] = only
              entry["export_only"] = bool(leg.get("export_only"))
              entry["vk_device"] = leg.get("vk_device", "")
              entry["headless"] = "1" if leg.get("headless") else ""
              chosen.append(entry)

          matrix = {"include": chosen}
          print("matrix=" + json.dumps(matrix))
          print("any=" + ("true" if chosen else "false"))

          summary = ["## Plan", "",
                     f"event `{event}`, ref `{ref}`, scope `{scope}`, legs `{wanted}`, rerun `{rerun}`", ""]
          for leg in chosen:
              rows = leg["only"] or ("screenshots only" if scope == "screenshots" else "the whole gate")
              summary.append(f"- **{leg['id']}** — {rows}")
          for name, why in skipped:
              summary.append(f"- ~~{name}~~ — {why}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(summary) + "\n")
          PY
          echo "planned:"; cat "$GITHUB_OUTPUT"

  gate:
    name: gate (${{ matrix.id }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # Hosted jobs are cut off at 6 hours.
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
        working-directory: vieww_base
    env:
      CARGO_TERM_COLOR: always
      # A hosted runner has no display and no GPU; a self-hosted one has both,
      # and `plan` says which this is. Empty rather than "0" so
      # `${VIEWW_CERT_NO_DESKTOP:-0}` reads it as unset.
      VIEWW_CERT_NO_DESKTOP: ${{ matrix.headless }}
      # Which adapter the GPU pass uses, when the leg names one.
      VIEWW_VK_DEVICE: ${{ matrix.vk_device }}
      # **Frame budgets are measured here and judged elsewhere.** A hosted
      # runner is a shared virtual machine, and the checklist already says to
      # treat its timings as indicative — so the animation-stress budget is
      # recorded rather than enforced on these machines, and enforced on the
      # self-hosted ones, which are real hardware. A stuttering animation still
      # fails everywhere; that is a picture, not a clock.
      VIEWW_TIMINGS_ADVISORY: ${{ matrix.hosted && '1' || '' }}
      # Throwaway machines: let the export suite add the Android/iOS/Windows
      # rustup targets (for this repo's toolchain and the scaffold's `stable`).
      # Never on a self-hosted machine, where the toolchains are the owner's.
      VIEWW_EXPORT_INSTALL_TARGETS: ${{ matrix.hosted && '1' || '' }}
      SCOPE: ${{ github.event_name == 'push' && 'gate' || inputs.scope }}
      PACKAGE: ${{ matrix.mode == 'cpu' && !matrix.export_only && (github.event_name == 'push' && 'true' || inputs.package) || 'false' }}
      # Decided in `plan` — empty means the whole gate.
      ONLY: ${{ matrix.only }}
      # FW-06: platform signing (packaging/sign.sh). Empty secrets mean
      # unsigned installers, said so in MANIFEST.txt; this workflow never runs
      # on pull requests, so fork code never sees them.
      APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
      APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Make disk space
        if: matrix.hosted
        run: bash ci/tools/ci-runner-prep.sh

      - name: Rust toolchain (from rust-toolchain.toml)
        if: matrix.hosted
        run: |
          rustup toolchain install   # reads rust-toolchain.toml (channel + components)
          rustc --version
          cargo --version

      - name: cargo-deny
        if: matrix.hosted && env.SCOPE != 'screenshots'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: WiX (Windows installer)
        if: matrix.os == 'windows' && env.PACKAGE == 'true' && env.SCOPE != 'screenshots'
        # v5: the last major without a EULA acceptance step; package.sh needs
        # only `wix build` and the <Files> element (v5+).
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"

      # ── Studio export route (G2.7-G2.11) ─────────────────────────────────
      # The Android SDK and NDK come with every hosted image (ci-runner-prep.sh
      # keeps them); these add what the images lack or version loosely.
      - name: JDK 17 (Android Gradle Plugin 8)
        if: matrix.mode == 'cpu' && matrix.hosted && env.SCOPE != 'screenshots'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9 (a scaffolded project has no wrapper JAR)
        if: matrix.mode == 'cpu' && matrix.hosted && env.SCOPE != 'screenshots'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: cargo-ndk
        if: matrix.mode == 'cpu' && matrix.hosted && env.SCOPE != 'screenshots'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: MinGW-w64 (Windows .exe cross-build from Linux)
        if: matrix.mode == 'cpu' && matrix.os == 'linux' && matrix.hosted && env.SCOPE != 'screenshots'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: Android environment
        if: matrix.mode == 'cpu' && matrix.hosted && env.SCOPE != 'screenshots'
        run: |
          # The newest NDK the image has; cargo-ndk and Studio both read
          # ANDROID_NDK_HOME, which some images point at an older one.
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}" >> "$GITHUB_ENV"
          echo "NDK: $ndk"; echo "SDK: ${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

      - name: Vulkan loader + MoltenVK (macOS; stages skip if no device)
        if: matrix.os == 'macos' && matrix.hosted && env.SCOPE != 'screenshots'
        run: brew install molten-vk vulkan-loader vulkan-tools || true

      - name: Release gate
        if: env.SCOPE == 'gate'
        run: |
          args=(--mode "${{ matrix.mode }}" --out "target/release-gate/${{ matrix.id }}")
          [[ "$PACKAGE" == true ]] || args+=(--skip-package)
          if [[ -n "$ONLY" ]]; then
            echo "rerunning only: $ONLY"
            args+=(--only "$ONLY")
            [[ ",$ONLY," == *",G3.1,"* ]] || args+=(--skip-package)
          fi
          bash ci/vieww gate "${args[@]}"

      # FW-04: what a clean machine gets is what the DMG carries. The gate
      # built it with --bundle-moltenvk (artifacts.sh forces the flag on
      # Darwin; package.sh fails when no source exists), so this step's job
      # is to read the *artifact* back and assert the files are in it —
      # trust the bundle, not the flags — and then a launch smoke: the
      # packaged executable has to open and stay up on this runner's GUI
      # session, which is the closest a hosted runner gets to the
      # clean-machine launch (first-frame *timings* stay on the hardware
      # runners' receipts, where the startup census lives).
      - name: MoltenVK in the shipped .app + launch smoke (FW-04)
        if: matrix.os == 'macos' && env.PACKAGE == 'true' && env.SCOPE == 'gate'
        run: |
          set -euo pipefail
          dmg=$(ls target/package/viewwstudio-macos-*.dmg 2>/dev/null | head -1)
          [[ -n "$dmg" ]] || { echo "FW-04: no macOS .dmg in target/package" >&2; exit 1; }
          mount="$RUNNER_TEMP/fw04-dmg"
          rm -rf "$mount"; mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg" >/dev/null
          app="$mount/vieww Studio.app"
          fail() { hdiutil detach "$mount" >/dev/null 2>&1 || true; echo "FW-04: $1" >&2; exit 1; }
          [[ -d "$app" ]] || fail "no vieww Studio.app inside $dmg"
          # The two files a clean-machine launch cannot open the GPU without
          # (ls assertions, per the FW-04 plan):
          [[ -f "$app/Contents/Frameworks/libMoltenVK.dylib" ]] ||
            fail "Contents/Frameworks/libMoltenVK.dylib is missing from the .app"
          [[ -f "$app/Contents/Resources/vulkan/icd.d/MoltenVK_icd.json" ]] ||
            fail "Contents/Resources/vulkan/icd.d/MoltenVK_icd.json is missing from the .app"
          # plutil assertions: the plist this bundle will be launched through
          # parses, and so does the ICD json the Vulkan loader reads.
          plutil -lint "$app/Contents/Info.plist"
          plutil -p "$app/Contents/Resources/vulkan/icd.d/MoltenVK_icd.json" | grep -q '../../Frameworks/libMoltenVK.dylib' ||
            fail "MoltenVK_icd.json's library_path does not point at the bundle's own dylib"
          echo "FW-04: $dmg carries MoltenVK (Frameworks dylib + icd.d json, library_path rewritten)"
          hdiutil detach "$mount" >/dev/null
          # Launch smoke: open the packaged executable for real, give it 20 s,
          # and it must still be running (a crash inside the window is the
          # failure this exists to catch). Kill it afterwards — the studio
          # has no auto-quit, by design.
          smoke="$RUNNER_TEMP/fw04-smoke"
          rm -rf "$smoke"; mkdir -p "$smoke"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg" >/dev/null
          cp -R "$app" "$smoke/vieww Studio.app"
          hdiutil detach "$mount" >/dev/null
          "$smoke/vieww Studio.app/Contents/MacOS/viewwstudio" >"$RUNNER_TEMP/fw04-smoke.log" 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid" || true
            echo "FW-04: the packaged studio exited within 20 s — log:" >&2
            cat "$RUNNER_TEMP/fw04-smoke.log" >&2 || true
            exit 1
          fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "FW-04: launch smoke passed (opened, 20 s, quit)"
          rm -rf "$smoke"

      # FW-05: the .msi a clean machine would install is the one the gate just
      # built. An administrative install (`msiexec /a`) unpacks it into a temp
      # directory without touching this machine's real Program Files —
      # "install to temp" — and then the payload's viewwstudio.exe has to
      # open and stay up 20 s, exactly the macOS launch smoke's contract.
      # Killed afterwards: the studio has no auto-quit, by design.
      - name: MSI smoke (FW-05)
        if: matrix.os == 'windows' && env.PACKAGE == 'true' && env.SCOPE == 'gate'
        run: |
          set -euo pipefail
          msi=$(ls target/package/viewwstudio-windows-*.msi 2>/dev/null | head -1)
          [[ -n "$msi" ]] || { echo "FW-05: no viewwstudio-windows-*.msi in target/package" >&2; exit 1; }
          dir="$RUNNER_TEMP/fw05-msi"
          rm -rf "$dir"; mkdir -p "$dir"
          # /qn: no UI on the runner. Exit 0 = installed, 3010 = installed with
          # a reboot pending; both are the installer succeeding.
          # `cmd //c` + cygpath: Git Bash rewrites a bare `/a` into a path,
          # and msiexec wants Windows paths in TARGETDIR.
          wmsi=$(cygpath -w "$msi")
          wdir=$(cygpath -w "$dir")
          rc=0
          cmd //c "msiexec /a \"$wmsi\" /qn TARGETDIR=\"$wdir\"" >/dev/null || rc=$?
          if [[ $rc -ne 0 && $rc -ne 3010 ]]; then
            echo "FW-05: msiexec /a exited $rc" >&2; exit 1
          fi
          exe=$(find "$dir" -name viewwstudio.exe -type f | head -1)
          [[ -n "$exe" ]] || { echo "FW-05: no viewwstudio.exe under the installed tree $dir" >&2; exit 1; }
          echo "FW-05: $msi installed to temp; payload: $exe"
          # Launch smoke: 20 s alive, then quit (killed — no auto-quit).
          "$exe" >"$RUNNER_TEMP/fw05-msi-smoke.log" 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid" || true
            echo "FW-05: the installed studio exited within 20 s — log:" >&2
            cat "$RUNNER_TEMP/fw05-msi-smoke.log" >&2 || true
            exit 1
          fi
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "FW-05: MSI smoke passed (installed to temp, opened, 20 s, quit)"
          rm -rf "$dir"

      # The failures and the end of each one's log, on the run's summary page and
      # in the job log — readable without downloading anything.
      - name: Failures with logs
        if: always() && env.SCOPE == 'gate'
        run: |
          run="target/release-gate/${{ matrix.id }}"
          [[ -f "$run/rows.tsv" ]] || { echo "no run folder"; exit 0; }
          py=$(command -v python3 || command -v python)
          "$py" ci/release/report-failures.py "$run" -o "$run/FAILURES.md"
          cat "$run/FAILURES.md"
          {
            echo "# ${{ matrix.id }}"
            cat "$run/FAILURES.md"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Ten pictures a person looks at (5 features + 5 studio) ───────────
      # Not a gate row and it fails nothing: `docs/RELEASE-CHECK.md`'s last
      # step is a person skimming the screenshots on each OS for missing
      # glyphs, clipped panels and wrong colours, and that person needs the
      # pictures attached to the run rather than buried in a gate folder they
      # have to download. Skipped on the GPU jobs (the CPU job on the same OS
      # draws the same pictures) and on the export-only job.
      - name: Screenshots
        if: always() && (env.SCOPE == 'gate' || env.SCOPE == 'screenshots') && matrix.mode == 'cpu' && !matrix.export_only
        continue-on-error: true
        run: bash ci/tools/screenshots.sh "target/screenshots/${{ matrix.id }}"

      - name: Upload screenshots
        if: always() && (env.SCOPE == 'gate' || env.SCOPE == 'screenshots') && matrix.mode == 'cpu' && !matrix.export_only
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.id }}
          path: vieww_base/target/screenshots/${{ matrix.id }}
          retention-days: 30
          if-no-files-found: warn

      - name: Checks only
        if: env.SCOPE == 'checks' && matrix.mode == 'cpu'
        run: bash ci/vieww checks

      - name: Upload run folder
        if: always() && env.SCOPE == 'gate'
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.id }}
          path: vieww_base/target/release-gate/${{ matrix.id }}
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

      - name: Upload installers
        if: always() && env.SCOPE == 'gate' && env.PACKAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.id }}
          path: |
            vieww_base/target/package/viewwstudio-*
            vieww_base/target/package/viewwstudio.cdx.json
            vieww_base/target/package/SHA256SUMS
            vieww_base/target/package/MANIFEST.txt
          retention-days: 30
          if-no-files-found: warn

  checklist:
    name: merged checklist
    needs: gate
    if: always() && (github.event_name == 'push' || inputs.scope == 'gate')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: gate-*
          path: runs
      - name: Fill the checklist from both runs
        run: |
          cd vieww_base && ln -sfn ../runs runs
          shopt -s nullglob
          dirs=(runs/gate-*)
          if ((${#dirs[@]} == 0)); then echo "no run folders to merge"; exit 0; fi
          python3 ci/release/fill-checklist.py "${dirs[@]}" -o CHECKLIST-ci.md || true
          python3 ci/release/report-failures.py "${dirs[@]}" -o FAILURES.md
          # Failures first: they are what a person opens this for.
          cat FAILURES.md >> "$GITHUB_STEP_SUMMARY"
          { echo; cat FAILURES.md; } >> CHECKLIST-ci.md
          # Every log of every run, without the images, in the same artifact as
          # the checklist (the one that is easy to find and download).
          mkdir -p logs
          for d in "${dirs[@]}"; do
            name=$(basename "$d")
            (cd "$d" && find . \( -name '*.txt' -o -name '*.tsv' -o -name '*.json' -o -name '*.md' -o -name '*.log' \) -print) |
              while read -r f; do mkdir -p "logs/$name/$(dirname "$f")"; cp "$d/$f" "logs/$name/$f"; done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: checklist-ci
          path: |
            vieww_base/CHECKLIST-ci.md
            vieww_base/FAILURES.md
            vieww_base/logs/
          if-no-files-found: warn

  # ── FW-03 / FW-06: the release itself ─────────────────────────────────────
  #
  # On a `v*` tag, after the gate: collect every leg's installers, merge their
  # SHA256SUMS, attach SLSA build provenance (GitHub's keyless Sigstore
  # attestation — no certificate to buy; `gh attestation verify <file> -R
  # <repo>` checks it), and open a DRAFT GitHub Release carrying the
  # installers, SHA256SUMS, the SBOM, CHECKLIST-ci.md and the CHANGELOG
  # section for the version. A human reads the checklist and publishes it.
  # Only this job gets write access, and only on tags.
  release:
    name: draft GitHub Release
    needs: [gate, checklist]
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist-in
      - uses: actions/download-artifact@v4
        with:
          name: checklist-ci
          path: checklist
      - name: Assemble
        id: assemble
        run: |
          set -euo pipefail
          mkdir -p dist
          find dist-in -type f ! -name SHA256SUMS ! -name MANIFEST.txt -exec cp {} dist/ \;
          [ -n "$(ls -A dist)" ] || { echo "no installers were produced by the gate" >&2; exit 1; }
          (cd dist && sha256sum -- * > SHA256SUMS)
          for m in dist-in/*/MANIFEST.txt; do
            echo "## $(basename "$(dirname "$m")")"; cat "$m"; echo
          done > dist/MANIFESTS.txt
          cp checklist/CHECKLIST-ci.md dist/ 2>/dev/null || true
          ver="${GITHUB_REF_NAME#v}"
          # This version's CHANGELOG section (up to the next "## [").
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}' vieww_base/CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          { echo; echo "Checksums: SHA256SUMS. Provenance: \`gh attestation verify <file> -R ${GITHUB_REPOSITORY}\`."; } >> notes.md
          echo "prerelease=$([[ "$ver" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Build provenance (Sigstore, keyless)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRE: ${{ steps.assemble.outputs.prerelease }}
        run: |
          flags=(--draft --title "vieww ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag)
          [ "$PRE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/* -R "$GITHUB_REPOSITORY"
