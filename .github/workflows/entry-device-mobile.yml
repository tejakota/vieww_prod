# GENERATED by .github/entry/entries.py from .github/entry/plan.py: edit those, not this.
#
# Device · Mobile: real phones: the phone farm and your own Android phone.
# The other forms: Cloud VM · Machines, Cloud VM · Mobile, Device · Machines. Nothing in this repository runs any other
# way: not on a push, a pull request, a schedule or another run.
#
# Tick what to run; the `└` fields under an item choose its steps and
# options. The run's summary starts with exactly what was chosen.

name: "Device · Mobile"

on:
  workflow_dispatch:
    inputs:
      phone_farm:
        description: "Phone farm: run on real phones"
        type: boolean
        default: false
      phone_low:
        description: "  └ low-end phone"
        type: boolean
        default: true
      phone_mid:
        description: "  └ mid-range phone"
        type: boolean
        default: true
      phone_high:
        description: "  └ high-end phone"
        type: boolean
        default: true
      phone_platform:
        description: "  └ platform"
        type: choice
        options:
          - "android"
          - "ios"
          - "both"
        default: "android"
      phone_count:
        description: "  └ phones spread from cheapest to most capable (before tiers)"
        type: choice
        options:
          - "3"
          - "5"
          - "8"
        default: "3"
      phone_profile:
        description: "  └ APK build profile"
        type: choice
        options:
          - "dist"
          - "release"
        default: "dist"
      phone_video:
        description: "  └ record video of each phone"
        type: boolean
        default: false
      android_phone:
        description: "Your Android phone (USB): the device suite"
        type: boolean
        default: false
      advanced:
        description: "Optional, for what the boxes don't offer: item:step key=value; … (see .github/workflows/README.md)"
        type: string
        default: ""
      save_results:
        description: "Save this run's results to the ci-results branch"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      framework_any: ${{ steps.plan.outputs.framework_any }}
      phone_farm: ${{ steps.plan.outputs.phone_farm }}
      phone_farm_count: ${{ steps.plan.outputs.phone_farm_count }}
      phone_farm_devices: ${{ steps.plan.outputs.phone_farm_devices }}
      phone_farm_only: ${{ steps.plan.outputs.phone_farm_only }}
      phone_farm_platform: ${{ steps.plan.outputs.phone_farm_platform }}
      phone_farm_profile: ${{ steps.plan.outputs.phone_farm_profile }}
      phone_farm_tiers: ${{ steps.plan.outputs.phone_farm_tiers }}
      phone_farm_video: ${{ steps.plan.outputs.phone_farm_video }}
      save_results: ${{ steps.plan.outputs.save_results }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/entry
      - id: plan
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: python3 .github/entry/plan.py device-mobile

  phone_farm:
    name: "phone farm"
    needs: plan
    if: needs.plan.outputs.phone_farm == 'true'
    uses: ./.github/workflows/device-mobile-phone-farm.yml
    with:
      only: ${{ needs.plan.outputs.phone_farm_only }}
      platform: ${{ needs.plan.outputs.phone_farm_platform }}
      profile: ${{ needs.plan.outputs.phone_farm_profile }}
      devices: ${{ needs.plan.outputs.phone_farm_devices }}
      count: ${{ needs.plan.outputs.phone_farm_count }}
      video: ${{ needs.plan.outputs.phone_farm_video == 'true' }}
      tiers: ${{ needs.plan.outputs.phone_farm_tiers }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write

  android_phone:
    name: "your Android phone"
    needs: plan
    if: needs.plan.outputs.framework_any == 'true'
    uses: ./.github/workflows/shared-framework-checks.yml
    with:
      legs: android-device
      device: true
    secrets: inherit
    permissions:
      contents: write
      actions: read

  results:
    name: save results
    needs: [plan, phone_farm, android_phone]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.save_results == 'true'
    uses: ./.github/workflows/shared-results.yml
    with:
      run_id: ${{ github.run_id }}
      workflow: ${{ github.workflow }}
      conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
    permissions:
      contents: write
      actions: read
