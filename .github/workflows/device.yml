# Device: everything that runs on your own machines and phones, in one Run workflow form.
#
# The only way anything in this repository runs: Actions → Device → Run
# workflow (the other entry is cloud-vm.yml, Cloud VM).
# Nothing starts on a push, a pull request, a schedule or another run.
#
# Tick items (Machines · / Mobile ·), optionally narrow them in `steps`,
# and pick the branch in the form's dropdown. The plan job checks the
# form (an unknown item, step or option fails it, naming what is valid)
# and the run's summary lists exactly what was chosen. Each item is a
# part file beside this one; its header lists its steps.

name: Device

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Optional: narrow or tune items, e.g. hardware_linux:gpu stress launches=3; feature:areas=wright depth=full; phone_farm:platform=both count=5"
        type: string
        default: ""
      feature:
        description: "Machines · Feature run: the checks for what this branch changed"
        type: boolean
        default: false
      hardware_linux:
        description: "Machines · Linux hardware (GPU, NVIDIA, gallery, desktop, audio)"
        type: boolean
        default: false
      hardware_windows:
        description: "Machines · Windows hardware (D3D12, gallery, desktop, audio)"
        type: boolean
        default: false
      hardware_macos:
        description: "Machines · macOS hardware (MoltenVK, gallery, desktop, audio)"
        type: boolean
        default: false
      release_gate_device:
        description: "Machines · Release gate on your machines (Linux CPU/GPU, Windows GPU)"
        type: boolean
        default: false
      phone_farm:
        description: "Mobile · Phone farm: build, then run on real Android/iOS phones"
        type: boolean
        default: false
      android_phone:
        description: "Mobile · Your Android phone (USB): the device suite"
        type: boolean
        default: false
      save_results:
        description: "Save this run's results to the ci-results branch"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      feature: ${{ steps.plan.outputs.feature }}
      feature_areas: ${{ steps.plan.outputs.feature_areas }}
      feature_depth: ${{ steps.plan.outputs.feature_depth }}
      framework_any: ${{ steps.plan.outputs.framework_any }}
      hardware_any: ${{ steps.plan.outputs.hardware_any }}
      hardware_launches: ${{ steps.plan.outputs.hardware_launches }}
      hardware_linux: ${{ steps.plan.outputs.hardware_linux }}
      hardware_linux_steps: ${{ steps.plan.outputs.hardware_linux_steps }}
      hardware_macos: ${{ steps.plan.outputs.hardware_macos }}
      hardware_macos_steps: ${{ steps.plan.outputs.hardware_macos_steps }}
      hardware_windows: ${{ steps.plan.outputs.hardware_windows }}
      hardware_windows_steps: ${{ steps.plan.outputs.hardware_windows_steps }}
      phone_farm: ${{ steps.plan.outputs.phone_farm }}
      phone_farm_count: ${{ steps.plan.outputs.phone_farm_count }}
      phone_farm_devices: ${{ steps.plan.outputs.phone_farm_devices }}
      phone_farm_only: ${{ steps.plan.outputs.phone_farm_only }}
      phone_farm_platform: ${{ steps.plan.outputs.phone_farm_platform }}
      phone_farm_profile: ${{ steps.plan.outputs.phone_farm_profile }}
      phone_farm_video: ${{ steps.plan.outputs.phone_farm_video }}
      release_gate_device: ${{ steps.plan.outputs.release_gate_device }}
      release_gate_device_legs: ${{ steps.plan.outputs.release_gate_device_legs }}
      release_gate_device_package: ${{ steps.plan.outputs.release_gate_device_package }}
      release_gate_device_rerun: ${{ steps.plan.outputs.release_gate_device_rerun }}
      release_gate_device_scope: ${{ steps.plan.outputs.release_gate_device_scope }}
      save_results: ${{ steps.plan.outputs.save_results }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/entry
      - id: plan
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: python3 .github/entry/plan.py device

  feature:
    name: "Machines · feature run"
    needs: plan
    if: needs.plan.outputs.feature == 'true'
    uses: ./.github/workflows/device-machines-feature.yml
    with:
      areas: ${{ needs.plan.outputs.feature_areas }}
      depth: ${{ needs.plan.outputs.feature_depth }}
    secrets: inherit

  hardware:
    name: "Machines · hardware"
    needs: plan
    if: needs.plan.outputs.hardware_any == 'true'
    uses: ./.github/workflows/device-machines-hardware.yml
    with:
      linux: ${{ needs.plan.outputs.hardware_linux == 'true' }}
      windows: ${{ needs.plan.outputs.hardware_windows == 'true' }}
      macos: ${{ needs.plan.outputs.hardware_macos == 'true' }}
      linux_steps: ${{ needs.plan.outputs.hardware_linux_steps }}
      windows_steps: ${{ needs.plan.outputs.hardware_windows_steps }}
      macos_steps: ${{ needs.plan.outputs.hardware_macos_steps }}
      launches: ${{ needs.plan.outputs.hardware_launches }}
    secrets: inherit
    permissions:
      contents: write

  release_gate:
    name: "Machines · release gate (your machines)"
    needs: plan
    if: needs.plan.outputs.release_gate_device == 'true'
    uses: ./.github/workflows/shared-release-gate.yml
    with:
      legs: ${{ needs.plan.outputs.release_gate_device_legs }}
      scope: ${{ needs.plan.outputs.release_gate_device_scope }}
      rerun: ${{ needs.plan.outputs.release_gate_device_rerun }}
      package: ${{ needs.plan.outputs.release_gate_device_package == 'true' }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      attestations: write

  phone_farm:
    name: "Mobile · phone farm"
    needs: plan
    if: needs.plan.outputs.phone_farm == 'true'
    uses: ./.github/workflows/device-mobile-phone-farm.yml
    with:
      only: ${{ needs.plan.outputs.phone_farm_only }}
      platform: ${{ needs.plan.outputs.phone_farm_platform }}
      profile: ${{ needs.plan.outputs.phone_farm_profile }}
      devices: ${{ needs.plan.outputs.phone_farm_devices }}
      count: ${{ needs.plan.outputs.phone_farm_count }}
      video: ${{ needs.plan.outputs.phone_farm_video == 'true' }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write

  android_phone:
    name: "Mobile · Android phone"
    needs: plan
    if: needs.plan.outputs.framework_any == 'true'
    uses: ./.github/workflows/shared-framework-checks.yml
    with:
      legs: android-device
      device: true
    secrets: inherit
    permissions:
      contents: write
      actions: read

  results:
    name: save results
    needs: [plan, feature, hardware, release_gate, phone_farm, android_phone]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.save_results == 'true'
    uses: ./.github/workflows/shared-results.yml
    with:
      run_id: ${{ github.run_id }}
      workflow: ${{ github.workflow }}
      conclusion: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
    permissions:
      contents: write
      actions: read
